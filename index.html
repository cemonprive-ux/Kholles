    if (all){ all.checked = n > 0 && n === visibleKeys.length; all.indeterminate = n > 0 && n < visibleKeys.length; }
    document.querySelectorAll(".pickbox").forEach(b => b.closest(".entry").classList.toggle("picked", b.checked));
    const a = $("#archSel"), d = $("#delSel");
    if (a){ a.disabled = !n; a.textContent = n ? "Archiver la sélection (" + n + ")" : "Sélectionnez les opérations à archiver"; }
    if (d){ d.disabled = !n; d.textContent = n ? "Supprimer la sélection (" + n + ")" : "Sélectionnez les opérations à supprimer"; }
  };
  document.querySelectorAll(".pickbox").forEach(b => b.onchange = () => { b.checked ? sel.add(b.value) : sel.delete(b.value); refreshSel(); });
  const all = $("#selAll");
  if (all) all.onchange = () => {
    visibleKeys.forEach(k => all.checked ? sel.add(k) : sel.delete(k));
    document.querySelectorAll(".pickbox").forEach(b => b.checked = all.checked);
    refreshSel();
  };
  refreshSel();
  document.querySelectorAll(".tab").forEach(t => t.onclick = () => { state.jTab = t.dataset.tab; sel.clear(); renderJournal(); });
  const ab = $("#archSel");
  if (ab) ab.onclick = () => { const keys = chosen(); confirmAdmin({
    title: "Archiver la sélection",
    text: `${plural(keys.length, "# opération sera déplacée", "# opérations seront déplacées")} vers les archives. Elles restent consultables dans l'onglet « Archives » et dans le Google Sheet jusqu'à leur suppression définitive.`,
    label: "Archiver", cls: "primary",
    payload: { action: "archive", keys },
    done: (r) => plural(r.moved, "# opération archivée.", "# opérations archivées.")
  }); };
  const db = $("#delSel");
  if (db) db.onclick = () => { const keys = chosen(); confirmAdmin({
    title: "Supprimer la sélection",
    text: `<b>Suppression définitive</b> de ${plural(keys.length, "# opération archivée", "# opérations archivées")}, y compris dans le Google Sheet. Cette action est irréversible.`,
    label: "Supprimer définitivement", cls: "danger-fill", warn: true,
    payload: { action: "purgeArchive", keys },
    done: (r) => plural(r.removed, "# opération supprimée.", "# opérations supprimées.")
  }); };
  const pa = $("#purgeAll");
  if (pa) pa.onclick = () => confirmAdmin({
    title: "Vider toutes les archives",
    text: `<b>Suppression définitive</b> de ${plural(state.archive.length, "l'opération archivée", "toutes les opérations archivées (#)")}, y compris dans le Google Sheet. Cette action est irréversible.`,
    label: "Vider définitivement", cls: "danger-fill", warn: true,
    payload: { action: "purgeArchive", all: true },
    done: (r) => plural(r.removed, "Archives vidées (# opération supprimée).", "Archives vidées (# opérations supprimées).")
  });
  $("#jYear").onchange = (e) => { state.jYear = e.target.value; renderJournal(); };
  const js = $("#jSearch");
  js.oninput = (e) => { state.jSearch = e.target.value; clearTimeout(js._t); js._t = setTimeout(() => { renderJournal(); const n = $("#jSearch"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };
}

/* ---------- Espace enseignants ---------- */
// Renvoie true si l'accès est ouvert ; sinon affiche le formulaire de code et renvoie false.
async function ensureTeacher(){
  if (DEMO || getCode()) return true;
  setAccent("1");
  setBar({ title: "Espace enseignants", back: true });
  $("#view").innerHTML = `
    <div class="tlogin">
      <div class="tlock">${ICON.lock}</div>
      <h2>Espace enseignants</h2>
      <p>Annulation des séances et journal des inscriptions.<br><small>Saisissez le code d'accès de votre matière.</small></p>
    </div>
    <form id="codeForm">
      <label class="lbl" for="code">Code d'accès</label>
      <input class="field" id="code" type="password" autocomplete="current-password" required>
      <div class="msg" id="msg"></div>
      <div class="actions"><button class="btn primary" type="submit" id="login">Entrer</button></div>
    </form>`;
  $("#codeForm").onsubmit = async (e) => {
    e.preventDefault();
    const btn = $("#login"), code = $("#code").value.trim();
    btn.disabled = true; btn.textContent = "Vérification…";
    let r;
    try { r = await API.journal(code); } catch(err){ r = { ok:false, error:"Connexion impossible." }; }
    if (!r.ok){ $("#msg").innerHTML = errBox(esc(r.error === "Code incorrect." ? "Code incorrect." : r.error || "Accès refusé.")); btn.disabled = false; btn.textContent = "Entrer"; return; }
    setCode(code); setSubject(r.subject);
    state.journal = r.log.slice().reverse(); state.archive = (r.archive || []).slice().reverse();
    if (!teacherYears().includes(state.aYear)) state.aYear = teacherYears()[0];
    route();
  };
  setTimeout(() => { const f = $("#code"); f && f.focus(); }, 50);
  return false;
}

const exportUrl = (what) => CONFIG.API_URL + "?action=export&what=" + what + "&code=" + encodeURIComponent(getCode());
async function renderProf(force){

  setAccent("1");
  setBar({ title: "Espace enseignants", sub: subjectLabelOf(getSubject()), back: true, refresh: true });
  const view = $("#view");
  if (force || !state.journal) view.innerHTML = '<div class="loading"><span class="spin"></span>Chargement…</div>';
  const years = teacherYears();
  await Promise.allSettled(years.map(y => loadBookings(y, force)));
  if (force || !state.journal){
    let r; try { r = await API.journal(getCode()); } catch(e){ r = { ok:false }; }
    if (r.ok){ setSubject(r.subject); state.journal = r.log.slice().reverse(); state.archive = (r.archive || []).slice().reverse(); }
    else if (r.error === "Code incorrect."){ setCode(""); return renderProf(); }
  }
  const nCancel = upcomingCancels(teacherYears()).length;

  view.innerHTML = demoBanner() + `
    <p class="kicker">Que souhaitez-vous faire ?</p>
    <div class="choices">
      <a class="tcard" href="#/prof/annulations">
        <span class="ticon t-annul">${ICON.ban}</span>
        <span class="tcbody"><span class="t">Annuler une séance</span><br>
          <span class="d">Annuler ou rétablir une séance de khôlle. Les étudiants voient un bandeau d'alerte.</span>
          <span class="qpills">${nCancel ? `<span class="pill cancel">${nCancel} séance${nCancel>1?"s":""} annulée${nCancel>1?"s":""} à venir</span>` : '<span class="pill full">Aucune annulation en cours</span>'}</span></span>
        ${ICON.chev}
      </a>
      <a class="tcard" href="#/prof/journal">
        <span class="ticon t-log">${ICON.list}</span>
        <span class="tcbody"><span class="t">Journal des inscriptions</span><br>
          <span class="d">Historique des inscriptions, remplacements et annulations. Archivage.</span>
          <span class="qpills"><span class="pill full">${nLog} opération${nLog>1?"s":""} au journal</span>${state.archive && state.archive.length ? `<span class="pill full">${state.archive.length} archivée${state.archive.length>1?"s":""}</span>` : ""}</span></span>
        ${ICON.chev}
      </a>
      ${DEMO ? "" : (() => { const a = PUSH.get("khollapp-alerts-prof"); return `
      <button class="tcard" id="profAlerts" type="button" style="width:100%;text-align:left;font:inherit;line-height:1.45;cursor:pointer">
        <span class="ticon t-alert">${ICON.bell}</span>
        <span class="tcbody"><span class="t">Alertes d'absence</span><br>
          <span class="d">Notification sur ce téléphone quand un étudiant se déclare absent à l'une de vos séances.</span>
          <span class="qpills">${a ? `<span class="pill free">Activées · ${esc(a.examiner + (subjEmoji(getSubject()) ? " " + subjEmoji(getSubject()) : ""))}</span>` : '<span class="pill full">Non activées</span>'}</span></span>
        ${ICON.chev}
      </button>`; })()}
      <a class="tcard" href="guide-enseignants.html">
        <span class="ticon t-guide">${ICON.info}</span>
        <span class="tcbody"><span class="t">Guide enseignant</span><br>
          <span class="d">Mode d'emploi illustré de l'Espace enseignants : annulations, journal, archives, exports.</span></span>
        ${ICON.chev}
      </a>
    </div>
    ${!DEMO && !IS_GOOGLE ? `
    <p class="kicker" style="margin-top:22px">Exporter pour Excel</p>
    <div class="group exports">
      <a class="xrow" href="${exportUrl("bookings")}">${ICON.list}<span><b>Inscriptions</b><br><small>Toutes les inscriptions en cours</small></span></a>
      <a class="xrow" href="${exportUrl("log")}">${ICON.list}<span><b>Journal</b><br><small>Historique complet, archives comprises</small></span></a>
      <a class="xrow" href="${exportUrl("cancels")}">${ICON.list}<span><b>Annulations</b><br><small>Séances annulées</small></span></a>

async function renderAnnul(force){
  if (!(await ensureTeacher())) return;
  if (!teacherYears().includes(state.aYear)) state.aYear = teacherYears()[0];
  const year = state.aYear, Y = CONFIG.YEARS[year];
  setAccent(year);
  setBar({ title: "Annuler une séance", sub: "Espace enseignants · " + subjectLabelOf(getSubject()), back: true, refresh: true });
  const view = $("#view");
  if (force || !state.bookings[year]) view.innerHTML = '<div class="loading"><span class="spin"></span>Chargement…</div>';
  try { await loadBookings(year, force); } catch(e){ view.innerHTML = errBox("Impossible de joindre le serveur."); return; }
  const b = state.bookings[year] || {}, now = new Date();
  const qs = khollesFor(year).filter(q => !khollePast(q, now));
  let html = demoBanner() + `
    <div class="tabs" role="tablist">${teacherYears().map(y => `<button role="tab" aria-selected="${y===year}" class="tab${y===year?" on":""}" data-y="${y}">${esc(CONFIG.YEARS[y].label)}</button>`).join("")}</div>
    <div class="alert info">${ICON.info}<span>Annuler une séance libère les inscriptions de ses créneaux et affiche un <b>bandeau d'alerte</b> aux étudiants. Ils peuvent alors se réinscrire sur une autre date de la khôlle. Une séance annulée par erreur peut être rétablie.</span></div>`;
  if (!qs.length) html += '<div class="empty">Aucune séance à venir.</div>';
  qs.forEach(q => {
    html += `<p class="kicker" style="margin-top:18px">Khôlle ${q.n} · ${esc(fmtDates(q.days.map(x => x.date)))}</p><div class="group">`;
    q.days.filter(x => !dayFrozen(x.date, now)).forEach(day => {
      const sessions = {};
      day.slots.forEach(sl => { (sessions[sl.sid] ||= []).push(sl); });
      Object.values(sessions).forEach(list => {
        const s0 = list[0], cx = cancelOf(s0);
        const n = list.filter(sl => b[sl.id]).length;
        const hours = list[0].label.split(" – ")[0] + " – " + list[list.length-1].label.split(" – ")[1];
        html += `<div class="srow${cx ? " is-cancelled" : ""}">
          <div class="sinfo">
            <div class="sday">${esc(fmtDay(day.date))}</div>
            <div class="smeta">${esc(exName(s0.year, s0.examiner))} · ${esc(s0.room)} · ${hours}</div>
            <div class="smeta">${cx ? `<span class="pill cancel">Annulée</span>${cx.reason ? " " + esc(cx.reason) : ""}` : `${n} inscrit${n>1?"s":""} / ${list.length}`}</div>
          </div>
          ${cx ? `<button class="sbtn restore" data-sid="${esc(s0.sid)}">Rétablir</button>` : `<button class="sbtn cancel" data-sid="${esc(s0.sid)}">Annuler</button>`}
        </div>`;
      });
    });
    html += `</div>`;
  });
  view.innerHTML = html;
  document.querySelectorAll(".tab[data-y]").forEach(t => t.onclick = () => { state.aYear = t.dataset.y; renderAnnul(); });
  const sessionSlots = (sid) => Object.values(SLOT_INDEX).filter(sl => sl.sid === sid).sort((a, c) => a.start - c.start);
  document.querySelectorAll(".sbtn").forEach(btn => btn.onclick = () => {
    const list = sessionSlots(btn.dataset.sid), s0 = list[0];
    const payload = { year: s0.year, q: s0.q, sid: s0.sid, date: s0.dateISO, examiner: s0.examiner, room: s0.room };
    const meta = `<p class="meta"><b>Khôlle ${s0.q}</b> · ${esc(Y.short)}<br>${fmtDay(s0.date)} · ${esc(exName(s0.year, s0.examiner))} · salle <b>${esc(s0.room)}</b></p>`;
    if (btn.classList.contains("restore")) return confirmAdmin({
      title: "Rétablir la séance", meta,
      text: "La séance redevient visible et réservable par les étudiants. Le bandeau d'alerte disparaît.",
      label: "Rétablir la séance", cls: "primary",
      payload: Object.assign({ action: "restoreSession" }, payload),
      done: () => "Séance rétablie.",
      after: () => renderAnnul(true)
    });
    const inscrits = list.filter(sl => b[sl.id]).map(sl => `<li><b>${esc(b[sl.id].student)}</b> · ${sl.label}</li>`);
    confirmAdmin({
      title: "Annuler la séance", meta, warn: true, cls: "danger-fill", label: "Annuler la séance",
      text: inscrits.length
        ? `<b>${inscrits.length} inscription${inscrits.length>1?"s":""} ${inscrits.length>1?"seront libérées":"sera libérée"}</b> :<ul class="clist">${inscrits.join("")}</ul>Ces étudiants pourront se réinscrire sur une autre date de la khôlle.`
        : "Aucun étudiant n'est inscrit sur cette séance.",
      extra: `<label class="lbl" for="reason">Motif affiché aux étudiants <span style="font-weight:500;color:var(--muted)">(facultatif)</span></label>
        <input class="field" id="reason" maxlength="120" placeholder="Ex. : examinateur absent, sortie pédagogique…">`,
      confirmLabel: "Je confirme l'annulation de cette séance.",
      collect: () => ({ reason: ($("#reason") || {}).value || "" }),
      payload: Object.assign({ action: "cancelSession" }, payload),
      done: (r) => (r.released && r.released.length) ? `Séance annulée · ${r.released.length} inscription${r.released.length>1?"s":""} libérée${r.released.length>1?"s":""}.` : "Séance annulée.",
      after: () => { state.journal = null; renderAnnul(true); }
    });
  });
}

function confirmAdmin(o){
  openSheet(`
    <h4 id="sheetTitle">${o.title}</h4>
    ${o.meta || ""}
    <div class="alert ${o.warn ? "err" : "info"}" style="margin-top:14px">${o.warn ? ICON.warn : ICON.info}<span>${o.text}</span></div>
    ${o.extra || ""}
    ${o.warn ? `<label class="check"><input type="checkbox" id="sure"> <span>${o.confirmLabel || "Je confirme la suppression définitive."}</span></label>` : ""}
    <div class="msg" id="msg"></div>
    <div class="actions">
      <button class="btn ${o.cls}" id="go" ${o.warn ? "disabled" : ""}>${o.label}</button>
      <button class="btn ghost" id="close">Annuler</button>
    </div>`);
  $("#close").onclick = closeSheet;
  const go = $("#go"), sure = $("#sure");
  if (sure) sure.onchange = () => { go.disabled = !sure.checked; };
  go.onclick = async () => {
    go.disabled = true; const label = go.textContent; go.textContent = "Traitement…";
    let r;
    const extra = o.collect ? o.collect() : {};
    try { r = await API.admin(Object.assign({ code: getCode() }, o.payload, extra)); } catch(e){ r = { ok:false, error:"Connexion impossible." }; }
    if (!r.ok){
      if (r.error === "Code incorrect."){ setCode(""); closeSheet(); route(); return; }
      $("#msg").innerHTML = errBox(esc(r.error || "Opération refusée.")); go.disabled = false; go.textContent = label; return;
    }
    closeSheet(); toast(o.done(r)); if (state.sel) state.sel.clear(); (o.after || (() => renderJournal(true)))(r);
  };
}

let toastT;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 3400);
}

/* ---------- Contrôle automatique de version ---------- */
// À chaque mise en ligne, augmenter APP_VERSION. L'appli compare sa version à celle publiée sur GitHub.
function checkVersion(){
  if (location.protocol === "file:") return;
  let last = 0; try { last = Number(sessionStorage.getItem("khollapp-vcheck") || 0); } catch(e){}
  if (Date.now() - last < 5 * 60000) return;           // au plus une vérification toutes les 5 minutes
  try { sessionStorage.setItem("khollapp-vcheck", String(Date.now())); } catch(e){}
  fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" })
    .then(r => r.ok ? r.text() : "")
    .then(html => {
      const m = html.match(/const APP_VERSION = "([^"]+)"/);
      if (m && m[1].localeCompare(APP_VERSION, undefined, { numeric: true }) > 0) showUpdate(m[1]);
    }).catch(() => {});
}
function showUpdate(v){
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  const how = standalone
    ? (isIOS
        ? "Si l'ancienne version réapparaît : balayez vers le haut depuis le bas de l'écran, faites glisser Kholl'app vers le haut pour la fermer, puis rouvrez-la depuis son icône."
        : "Si l'ancienne version réapparaît : ouvrez les applis récentes (bouton carré ou balayage depuis le bas), faites glisser Kholl'app pour la fermer, puis rouvrez-la depuis son icône.")
    : "Si l'ancienne version réapparaît : fermez cet onglet, puis rouvrez le lien de Kholl'app.";
  const bar = $("#updateBar");
  bar.innerHTML = `
    <div class="upd">
      <div class="upd-ico">${ICON.refreshArrow}</div>
      <div class="upd-body">
        <b>Nouvelle version de Kholl'app disponible</b>
        <span>Touchez « Mettre à jour » pour l'installer (quelques secondes).</span>
        <details><summary>Ça ne marche pas ?</summary><span>${how}</span></details>
      </div>
      <div class="upd-actions">
        <button class="btn primary" id="doUpdate">Mettre à jour</button>
        <button class="upd-close" id="later" aria-label="Plus tard">×</button>
      </div>
    </div>`;
  bar.hidden = false;
  $("#doUpdate").onclick = () => {
    $("#doUpdate").textContent = "Mise à jour…";
    location.replace(location.pathname + "?v=" + encodeURIComponent(v) + location.hash);
  };
  $("#later").onclick = () => { bar.hidden = true; };
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkVersion(); });
window.addEventListener("pageshow", checkVersion);
setInterval(checkVersion, 30 * 60000);

route();
</script>
