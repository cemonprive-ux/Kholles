<style>
:root{
  --bg:#EDF3FA; --surface:#FFFFFF; --surface-2:#F4F8FD; --ink:#12233D; --ink-2:#3F4F66; --muted:#5F6B7D;
  --line:#D9E3F0; --y1:#1461E0; --y1-soft:#E2ECFF; --y2:#0B7490; --y2-soft:#D9F1F7;
  --brand:linear-gradient(180deg,#05B8F5 0%,#1668F2 100%);
  --ok:#2F6B45; --ok-soft:#E1EFE5; --shadow:0 1px 2px rgba(27,42,58,.06),0 4px 16px rgba(27,42,58,.06);
  --accent:var(--y1); --accent-soft:var(--y1-soft);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11161D; --surface:#1A212B; --surface-2:#212A36; --ink:#EEF1F4; --ink-2:#C2C9D2; --muted:#9AA4B0;
    --line:#2C3644; --y1:#6FA4FF; --y1-soft:#1B2B4A; --y2:#5CCBE6; --y2-soft:#16333D;
    --brand:linear-gradient(180deg,#0A7FC0 0%,#1450C8 100%);
    --ok:#7BC795; --ok-soft:#1D3326; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Quicksand",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
@media (min-width:560px){
  body{padding:24px 0}
  .app{min-height:calc(100vh - 48px);border-radius:28px;box-shadow:0 20px 60px rgba(27,42,58,.18);overflow:hidden;border:1px solid var(--line)}
}
/* Barre d'application */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;background:var(--brand);color:#fff}
.bar h1{flex:1;margin:0;text-align:center;font-family:"Quicksand",system-ui,sans-serif;font-size:20px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sub{display:block;font-family:"Quicksand",sans-serif;font-size:12.5px;font-weight:600;opacity:.9;letter-spacing:.3px}
.iconbtn{width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:rgba(255,255,255,.1)}
.iconbtn:focus-visible,.card:focus-visible,.slot:focus-visible,.btn:focus-visible,.week:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.iconbtn svg{width:22px;height:22px}
.bar .spacer{width:44px;flex:none}
main{flex:1;padding:16px 16px calc(env(safe-area-inset-bottom) + 28px)}
/* Accueil */
.hero{padding:24px 8px 18px;text-align:center}
.logo{display:block;width:120px;height:120px;margin:0 auto 16px;border-radius:27px;box-shadow:0 10px 28px rgba(22,104,242,.28)}
.hero h2{margin:0;font-family:"Quicksand",system-ui,sans-serif;font-size:38px;font-weight:700;line-height:1.1}
.hero .tag1{margin:10px 0 0;font-size:19px;font-weight:700;color:var(--y1)}
.hero .tag2{margin:4px 0 0;color:var(--ink-2);font-weight:600;font-size:15px}
.choices{display:grid;gap:14px;margin-top:18px}
.card{display:flex;align-items:center;gap:16px;width:100%;padding:18px;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--shadow);text-align:left;cursor:pointer;text-decoration:none;color:inherit;transition:transform .12s ease}
.card:active{transform:scale(.985)}
.card .num{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-family:"Quicksand",system-ui,sans-serif;font-size:30px;font-weight:700;flex:none}
.card.y1 .num{background:var(--y1-soft);color:var(--y1)}
.card.y2 .num{background:var(--y2-soft);color:var(--y2)}
.card .t{font-weight:700;font-size:19px}
.card .d{color:var(--muted);font-size:14px}
.card .chev{margin-left:auto;color:var(--muted)}
.foot{margin-top:28px;text-align:center;color:var(--muted);font-size:13px}
/* Titres de section */
.kicker{margin:6px 4px 10px;font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
/* Semaines */
.weeks{display:grid;gap:10px}
.week{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);text-decoration:none;color:inherit;cursor:pointer;min-height:64px}
.week .wk{font-weight:700}
.week .wd{font-size:14px;color:var(--muted)}
.week .pill{margin-left:auto;flex:none}
.week.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.free{background:var(--ok-soft);color:var(--ok)}
.pill.full{background:var(--surface-2);color:var(--muted)}
.pill.now{background:var(--accent);color:#fff;margin-left:8px;vertical-align:1px}
.toggle{display:block;margin:16px auto 0;border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:10px;min-height:44px}
/* Créneaux */
.day{margin-bottom:22px}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 4px 8px}
.dayhead h3{margin:0;font-family:"Quicksand",system-ui,sans-serif;font-size:21px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px}
.ghead{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.ghead .who{font-weight:700}
.room{margin-left:auto;padding:4px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;letter-spacing:.4px}
.slot{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}
.slot:first-of-type{border-top:0}
.slot:hover{background:var(--surface-2)}
.slot .time{font-variant-numeric:tabular-nums;font-weight:700;min-width:118px}
.slot .state{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;text-align:right}
.slot .dot{width:10px;height:10px;border-radius:50%;flex:none}
.slot.free .dot{background:var(--ok)}
.slot.free .state{color:var(--ok);font-weight:700}
.slot.taken .dot{background:var(--accent)}
.slot.taken .state{color:var(--ink);font-weight:600}
.slot.past{cursor:default}
.slot.past .time,.slot.past .state{color:var(--muted);font-weight:500}
.slot.past .dot{background:var(--line)}
.slot.past:hover{background:transparent}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:16px}
.banner{margin:0 0 14px;padding:10px 14px;border-radius:12px;font-size:13.5px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.banner.warn{background:#FFF4D6;color:#6B4E00;border-color:#EBD48F}
@media (prefers-color-scheme: dark){.banner.warn{background:#3A3016;color:#F1D98B;border-color:#5A4A1E}}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px;color:var(--muted)}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Feuille (bottom sheet) */
.scrim{position:fixed;inset:0;background:rgba(10,15,22,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:480px;transform:translate(-50%,105%);transition:transform .25s cubic-bezier(.2,.8,.2,1),visibility 0s linear .25s;visibility:hidden;z-index:21;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 22px);box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet.open{transform:translate(-50%,0);visibility:visible;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h4{margin:0;font-family:"Quicksand",system-ui,sans-serif;font-size:23px}
.meta{margin:6px 0 18px;color:var(--ink-2);font-size:15px}
.meta b{color:var(--ink)}
label.lbl{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.selectwrap{position:relative}
select{width:100%;min-height:52px;padding:12px 44px 12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);font-size:17px;appearance:none;-webkit-appearance:none;cursor:pointer}
select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.selectwrap svg{position:absolute;right:14px;top:50%;width:20px;height:20px;transform:translateY(-50%);pointer-events:none;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.actions{display:grid;gap:10px;margin-top:20px}
.btn{min-height:52px;border-radius:14px;border:0;font-weight:700;font-size:16px;cursor:pointer;padding:0 18px}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink-2)}
.btn.danger{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--surface-2);font-size:14.5px;cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
/* Notification */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translate(-50%,140%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:15px;z-index:30;transition:transform .25s,visibility 0s linear .25s;visibility:hidden;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast.show{transform:translate(-50%,0);visibility:visible;transition:transform .25s}
@media (prefers-color-scheme: dark){.toast{background:#EEF1F4;color:#11161D}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<body>
<div class="app">
  <header class="bar">
    <button class="iconbtn" id="back" aria-label="Retour" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="spacer" id="backspacer"></span>
    <h1 id="title">Kholl'app</h1>
    <button class="iconbtn" id="refresh" aria-label="Actualiser" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>
    </button>
    <span class="spacer" id="refreshspacer"></span>
  </header>
  <main id="view" aria-live="polite"></main>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
  <div class="grab"></div>
  <div id="sheetBody"></div>
</section>
<div class="toast" id="toast" role="status"></div>

<script>
/* =====================================================================
   CONFIGURATION — seule partie à modifier
   ===================================================================== */
const CONFIG = {
  // URL de l'application Web Google Apps Script (voir le guide).
  // Laisser vide = mode démonstration (inscriptions visibles sur cet appareil uniquement).
  API_URL: "",

  SLOT_MINUTES: 40,   // durée d'un créneau
  STEP_MINUTES: 20,   // décalage entre deux créneaux
  END_DATE: "2027-05-28", // dernière date d'interrogation de l'année

  // Périodes sans khôlles (vacances zone A 2026-2027, jours fériés, ponts). Dates incluses.
  CLOSED: [
    ["2026-10-17", "2026-11-01", "Vacances de la Toussaint"],
    ["2026-11-11", "2026-11-11", "Armistice"],
    ["2026-12-19", "2027-01-03", "Vacances de Noël"],
    ["2027-02-13", "2027-02-28", "Vacances d'hiver"],
    ["2027-03-29", "2027-03-29", "Lundi de Pâques"],
    ["2027-04-10", "2027-04-25", "Vacances de printemps"],
    ["2027-05-06", "2027-05-07", "Pont de l'Ascension"],
    ["2027-05-17", "2027-05-17", "Lundi de Pentecôte"]
  ],

  YEARS: {
    "1": {
      label: "Première année",
      short: "1re année",
      start: "2026-09-14", // lundi de la première semaine
      // weekday : 1 = lundi … 5 = vendredi
      sessions: [
        { weekday: 3, start: "16:00", count: 5, examiner: "Mme Pénilleau", room: "C416" },
        { weekday: 5, start: "12:00", count: 6, examiner: "M. Blanchet",   room: "C415" }
      ],
      // Exceptions : pour une date donnée, remplace les séances prévues ce jour-là ([] = annulé).
      overrides: {
        "2026-09-25": [{ start: "13:00", count: 6, examiner: "M. Blanchet", room: "C415" }]
      },
      students: [
        "BEAL Romain","BENEZET Maëlie","BRONGNIART Théo","CAILLAT Tayna","CLUZEL Séraphin",
        "DA SILVA Maëlys","DEBARD Marie-Sophie","DOSGILIBERT Malo","ERRACHIDI Marwa","GENEST Mathias",
        "GENESTE Tara","GOUNANI Islem","MFOUGOULIE Killian","MOULIN Louise","MUSTAFA BENSSOUSSI Nizar",
        "PROVOST Lola","SIRE Aniah","TOURNADRE Eva","YARED Yafet","YASAR Cemile","ZAOUALI Merième"
      ]
    },
    "2": {
      label: "Deuxième année",
      short: "2e année",
      start: "2026-09-28",
      sessions: [
        { weekday: 1, start: "12:00", count: 5, examiner: "M. Blanchet",      room: "C415" },
        { weekday: 1, start: "16:00", count: 5, examiner: "Mme Bedestroffer", room: "C416" }
      ],
      overrides: {},
      students: [
        "AUBUGEAU Antoine","BARABAS Adriana","BERTHOLON Axel","CHAUCHARD Achille","CHENOT Evan",
        "COLRAT Mathilde","CROUZIER Clara","DEMAY Lalie","DOUVIZY Clara","DUBROUILLET Méline",
        "EZZERARI Aymane","GIRARD Bayron","KARBIA Nejia","KENOUDI Souhile","MONTEL Jules",
        "MORLEVAT Anaïs","REZAÏK Milhane","RONGIER Leane","ROZIERE Thomas","YAHIA Marwan"
      ]
    }
  }
};
/* ===================================================================== */

const JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

/* ---------- Dates ---------- */
function parseISO(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(d,n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function mondayOf(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const w = (x.getDay()+6)%7; return addDays(x,-w); }
function fmtTime(min){ const h = Math.floor(min/60), m = min%60; return h+"h"+(m ? String(m).padStart(2,"0") : ""); }
function toMin(hhmm){ const [h,m] = hhmm.split(":").map(Number); return h*60+m; }
function fmtDay(d){ return cap(JOURS[d.getDay()])+" "+d.getDate()+(d.getDate()===1?"er":"")+" "+MOIS[d.getMonth()]; }
function fmtShort(d){ return d.getDate()+(d.getDate()===1?"er":"")+" "+MOIS[d.getMonth()]; }
function closedReason(dISO){ for (const [a,b,r] of CONFIG.CLOSED) if (dISO >= a && dISO <= b) return r; return null; }

/* ---------- Construction du calendrier ---------- */
function sessionsFor(year, date){
  const Y = CONFIG.YEARS[year], k = iso(date);
  if (closedReason(k)) return [];
  if (Y.overrides && Object.prototype.hasOwnProperty.call(Y.overrides, k)) return Y.overrides[k];
  const wd = date.getDay();
  return Y.sessions.filter(s => s.weekday === wd);
}
function slotsForWeek(year, monday){
  const out = [];
  for (let i = 0; i < 7; i++){
    const d = addDays(monday, i), dISO = iso(d);
    if (dISO < CONFIG.YEARS[year].start || dISO > CONFIG.END_DATE) continue;
    sessionsFor(year, d).forEach(s => {
      for (let n = 0; n < s.count; n++){
        const st = toMin(s.start) + n*CONFIG.STEP_MINUTES, en = st + CONFIG.SLOT_MINUTES;
        out.push({
          id: year+"|"+dISO+"|"+String(st).padStart(4,"0")+"|"+s.room,
          year, date: d, dateISO: dISO, week: iso(monday),
          start: st, label: fmtTime(st)+" – "+fmtTime(en),
          examiner: s.examiner, room: s.room,
          startsAt: new Date(d.getFullYear(), d.getMonth(), d.getDate(), Math.floor(st/60), st%60)
        });
      }
    });
  }
  return out;
}
function weeksFor(year){
  const res = [];
  let m = mondayOf(parseISO(CONFIG.YEARS[year].start));
  const end = parseISO(CONFIG.END_DATE);
  while (m <= end){
    const slots = slotsForWeek(year, m);
    if (slots.length) res.push({ monday: m, key: iso(m), slots });
    m = addDays(m, 7);
  }
  return res;
}

/* ---------- Stockage (Google Sheets ou démo locale) ---------- */
const DEMO = !CONFIG.API_URL;
const LS_KEY = "khollapp-demo";
function demoRead(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch(e){ return []; } }
function demoWrite(a){ try { localStorage.setItem(LS_KEY, JSON.stringify(a)); } catch(e){} }

const API = {
  async list(year){
    if (DEMO) return demoRead().filter(b => b.year === year);
    const r = await fetch(CONFIG.API_URL + "?action=list&year=" + encodeURIComponent(year), { cache: "no-store" });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "Erreur serveur");
    return j.bookings;
  },
  async post(payload){
    if (DEMO){
      const all = demoRead();
      if (payload.action === "book"){
        if (all.some(b => b.slotId === payload.slotId)) return { ok:false, error:"Ce créneau vient d'être réservé." };
        if (all.some(b => b.year === payload.year && b.week === payload.week && b.student === payload.student))
          return { ok:false, error:"Vous êtes déjà inscrit(e) cette semaine." };
        all.push({ slotId: payload.slotId, year: payload.year, week: payload.week, student: payload.student });
      } else if (payload.action === "cancel"){
        const i = all.findIndex(b => b.slotId === payload.slotId && b.student === payload.student);
        if (i < 0) return { ok:false, error:"Inscription introuvable." };
        all.splice(i,1);
      }
      demoWrite(all); return { ok:true };
    }
    // text/plain : évite la requête préalable CORS, accepté par Apps Script
    const r = await fetch(CONFIG.API_URL, { method:"POST", body: JSON.stringify(payload) });
    return r.json();
  }
};

/* ---------- État et navigation ---------- */
const state = { bookings: {}, loaded: {}, showPast: false, poll: null };

function setBar({ title, sub, back, refresh }){
  $("#title").innerHTML = esc(title) + (sub ? '<span class="sub">'+esc(sub)+'</span>' : "");
  $("#back").hidden = !back; $("#backspacer").hidden = !!back;
  $("#refresh").hidden = !refresh; $("#refreshspacer").hidden = !!refresh;
  document.title = title === "Kholl'app" ? "Kholl'app" : title + " · Kholl'app";
}
function setAccent(year){
  const r = document.documentElement.style;
  r.setProperty("--accent", year === "2" ? "var(--y2)" : "var(--y1)");
  r.setProperty("--accent-soft", year === "2" ? "var(--y2-soft)" : "var(--y1-soft)");
}
function go(hash){ location.hash = hash; }
$("#back").addEventListener("click", () => {
  const p = location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  go(p.length > 1 ? "#/"+p[0] : "#/");
});
$("#refresh").addEventListener("click", () => route(true));

async function loadBookings(year, force){
  if (!force && state.loaded[year] && Date.now() - state.loaded[year] < 15000) return;
  const list = await API.list(year);
  const map = {}; list.forEach(b => map[b.slotId] = b);
  state.bookings[year] = map; state.loaded[year] = Date.now();
}

async function route(force){
  clearInterval(state.poll);
  const p = location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  const year = p[0], week = p[1];
  if (!year || !CONFIG.YEARS[year]) return renderHome();
  setAccent(year);
  try { localStorage.setItem("khollapp-year", year); } catch(e){}
  const view = $("#view");
  if (!state.bookings[year]) view.innerHTML = '<div class="loading"><span class="spin"></span>Chargement…</div>';
  try { await loadBookings(year, force); }
  catch(e){ view.innerHTML = '<div class="banner warn">Impossible de joindre le serveur des inscriptions. Vérifiez votre connexion puis actualisez.</div>'; setBar({ title: CONFIG.YEARS[year].label, back:true, refresh:true }); return; }
  if (week) renderWeek(year, week); else renderWeeks(year);
  state.poll = setInterval(async () => {
    if (document.hidden || $("#sheet").classList.contains("open")) return;
    try { await loadBookings(year, true); week ? renderWeek(year, week) : renderWeeks(year); } catch(e){}
  }, 30000);
}
window.addEventListener("hashchange", () => { closeSheet(); route(); });

/* ---------- Écrans ---------- */
function demoBanner(){
  return DEMO ? '<div class="banner warn"><b>Mode démonstration.</b> Les inscriptions ne sont enregistrées que sur cet appareil. Renseignez API_URL pour les partager.</div>' : "";
}

function renderWeeks(year){
  const Y = CONFIG.YEARS[year];
  setBar({ title: Y.label, sub: "Choisir une semaine", back: true, refresh: true });
  const b = state.bookings[year] || {};
  const nowMon = iso(mondayOf(new Date()));
  const weeks = weeksFor(year);
  const past = weeks.filter(w => w.key < nowMon), next = weeks.filter(w => w.key >= nowMon);
  const shown = state.showPast ? weeks : next;
  const card = (w) => {
    const now = new Date();
    const open = w.slots.filter(s => s.startsAt > now);
    const free = open.filter(s => !b[s.id]).length;
    const pill = !open.length ? '<span class="pill full">Terminée</span>'
      : free ? `<span class="pill free">${free} libre${free>1?"s":""}</span>` : '<span class="pill full">Complet</span>';
    const days = [...new Set(w.slots.map(s => s.dateISO))].map(d => fmtDay(parseISO(d))).join(" · ");
    return `<a class="week${w.key===nowMon?" current":""}" href="#/${year}/${w.key}">
      <span><span class="wk">Semaine du ${fmtShort(w.monday)}${w.key===nowMon?'<span class="pill now">Cette semaine</span>':""}</span><br>
      <span class="wd">${esc(days)}</span></span>${pill}</a>`;
  };
  $("#view").innerHTML = demoBanner() + `<p class="kicker">Semaines d'interrogation</p>` +
    (shown.length ? `<div class="weeks">${shown.map(card).join("")}</div>` : '<div class="empty">Aucune semaine à venir.</div>') +
    (past.length ? `<button class="toggle" id="togglePast">${state.showPast ? "Masquer les semaines passées" : "Afficher les semaines passées ("+past.length+")"}</button>` : "");
  const t = $("#togglePast"); if (t) t.onclick = () => { state.showPast = !state.showPast; renderWeeks(year); };
}

function renderWeek(year, weekKey){
  const Y = CONFIG.YEARS[year];
  const monday = parseISO(weekKey);
  setBar({ title: "Semaine du " + fmtShort(monday), sub: Y.short, back: true, refresh: true });
  const slots = slotsForWeek(year, monday);
  const b = state.bookings[year] || {};
  const now = new Date();
  if (!slots.length){ $("#view").innerHTML = '<div class="empty">Pas de khôlle cette semaine.</div>'; return; }
  // Regroupement jour → examinateur/salle
  const days = {};
  slots.forEach(s => {
    (days[s.dateISO] ||= {});
    const g = s.examiner+"|"+s.room;
    (days[s.dateISO][g] ||= []).push(s);
  });
  let html = demoBanner();
  Object.keys(days).sort().forEach(d => {
    const all = Object.values(days[d]).flat();
    const free = all.filter(s => s.startsAt > now && !b[s.id]).length;
    html += `<section class="day"><div class="dayhead"><h3>${fmtDay(parseISO(d))}</h3>
      ${all.every(s => s.startsAt <= now) ? '<span class="pill full">Passé</span>' : free ? `<span class="pill free">${free} libre${free>1?"s":""}</span>` : '<span class="pill full">Complet</span>'}</div>`;
    Object.entries(days[d]).forEach(([g, list]) => {
      const [ex, room] = g.split("|");
      html += `<div class="group"><div class="ghead"><span class="who">${esc(ex)}</span><span class="room">${esc(room)}</span></div>`;
      list.forEach(s => {
        const bk = b[s.id], past = s.startsAt <= now;
        const cls = past ? "past" : bk ? "taken" : "free";
        const txt = bk ? esc(bk.student) : past ? "—" : "Libre";
        html += `<button class="slot ${cls}" data-id="${esc(s.id)}" ${past && !bk ? 'aria-disabled="true"' : ""}>
          <span class="time">${s.label}</span><span class="state">${txt}<span class="dot" aria-hidden="true"></span></span></button>`;
      });
      html += `</div>`;
    });
    html += `</section>`;
  });
  $("#view").innerHTML = html;
  const byId = Object.fromEntries(slots.map(s => [s.id, s]));
  document.querySelectorAll(".slot").forEach(el => el.addEventListener("click", () => {
    const s = byId[el.dataset.id]; if (!s) return;
    if (s.startsAt <= new Date()) return toast("Ce créneau est passé.");
    b[s.id] ? openCancel(s, b[s.id]) : openBook(s);
  }));
}

/* ---------- Feuilles d'action ---------- */
let lastFocus = null;
function openSheet(html){
  lastFocus = document.activeElement;
  $("#sheetBody").innerHTML = html;
  $("#scrim").classList.add("open"); $("#sheet").classList.add("open"); $("#sheet").setAttribute("aria-hidden","false");
  setTimeout(() => { const f = $("#sheet select, #sheet input, #sheet .btn"); f && f.focus(); }, 260);
}
function closeSheet(){
  $("#scrim").classList.remove("open"); $("#sheet").classList.remove("open"); $("#sheet").setAttribute("aria-hidden","true");
  if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus();
}
$("#scrim").addEventListener("click", closeSheet);
$("#sheet").addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

function slotMeta(s){
  return `<p class="meta"><b>${fmtDay(s.date)}</b> · ${s.label}<br>${esc(s.examiner)} · salle <b>${esc(s.room)}</b></p>`;
}

function openBook(s){
  const Y = CONFIG.YEARS[s.year], b = state.bookings[s.year] || {};
  const already = new Set(Object.values(b).filter(x => x.week === s.week).map(x => x.student));
  const avail = Y.students.filter(n => !already.has(n));
  openSheet(`
    <h4 id="sheetTitle">Réserver ce créneau</h4>
    ${slotMeta(s)}
    ${avail.length ? `
      <label class="lbl" for="who">Votre nom</label>
      <div class="selectwrap">
        <select id="who">
          <option value="">Sélectionnez votre nom…</option>
          ${avail.map(n => `<option>${esc(n)}</option>`).join("")}
        </select>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <p class="hint">Un seul créneau par étudiant et par semaine. Les noms déjà inscrits cette semaine n'apparaissent pas.</p>
      <div class="actions">
        <button class="btn primary" id="confirm" disabled>Confirmer l'inscription</button>
        <button class="btn ghost" id="cancelSheet">Annuler</button>
      </div>` : `
      <div class="empty">Tous les étudiants sont déjà inscrits cette semaine.</div>
      <div class="actions"><button class="btn ghost" id="cancelSheet">Fermer</button></div>`}`);
  $("#cancelSheet").onclick = closeSheet;
  const sel = $("#who"), btn = $("#confirm");
  if (!sel) return;
  sel.onchange = () => { btn.disabled = !sel.value; };
  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = "Enregistrement…";
    try {
      const r = await API.post({ action:"book", year:s.year, week:s.week, slotId:s.id, student:sel.value,
        date:s.dateISO, time:s.label, examiner:s.examiner, room:s.room });
      closeSheet();
      toast(r.ok ? "Inscription enregistrée." : r.error || "Échec de l'inscription.");
    } catch(e){ closeSheet(); toast("Connexion impossible. Réessayez."); }
    await refreshCurrent();
  };
}

function openCancel(s, bk){
  openSheet(`
    <h4 id="sheetTitle">Créneau réservé</h4>
    ${slotMeta(s)}
    <p style="margin:0 0 14px">Inscrit(e) : <b>${esc(bk.student)}</b></p>
    <label class="check"><input type="checkbox" id="me"> <span>Je suis ${esc(bk.student)} et je souhaite libérer ce créneau.</span></label>
    <div class="actions">
      <button class="btn danger" id="doCancel" disabled>Libérer le créneau</button>
      <button class="btn ghost" id="cancelSheet">Fermer</button>
    </div>`);
  $("#cancelSheet").onclick = closeSheet;
  const me = $("#me"), btn = $("#doCancel");
  me.onchange = () => { btn.disabled = !me.checked; };
  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = "Libération…";
    try {
      const r = await API.post({ action:"cancel", year:s.year, slotId:s.id, student:bk.student, date:s.dateISO, time:s.label, room:s.room });
      closeSheet(); toast(r.ok ? "Créneau libéré." : r.error || "Échec.");
    } catch(e){ closeSheet(); toast("Connexion impossible. Réessayez."); }
    await refreshCurrent();
  };
}

async function refreshCurrent(){
  const p = location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  if (!p[0]) return;
  try { await loadBookings(p[0], true); } catch(e){}
  p[1] ? renderWeek(p[0], p[1]) : renderWeeks(p[0]);
}

let toastT;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 3200);
}

route();
</script>
