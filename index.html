<style>
:root{
  --bg:#EDF3FA; --surface:#FFFFFF; --surface-2:#F4F8FD; --ink:#12233D; --ink-2:#3F4F66; --muted:#5F6B7D;
  --line:#D9E3F0; --y1:#1461E0; --y1-soft:#E2ECFF; --y2:#0B7490; --y2-soft:#D9F1F7;
  --y1-strong:#1461E0; --y2-strong:#0B7490; --head:var(--y1-strong); --taken:#D92D20;
  --ok:#23703F; --ok-soft:#E0F2E6; --err:#B42318; --err-soft:#FDECEA; --warn:#8A5A00; --warn-soft:#FFF4D6; --warn-line:#EBD48F;
  --brand:linear-gradient(180deg,#05B8F5 0%,#1668F2 100%);
  --shadow:0 1px 2px rgba(18,35,61,.06),0 4px 16px rgba(18,35,61,.06);
  --accent:var(--y1); --accent-soft:var(--y1-soft);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10161F; --surface:#18212C; --surface-2:#202B38; --ink:#EEF2F7; --ink-2:#C3CCD8; --muted:#9AA6B5;
    --y1-strong:#2A5FC4; --y2-strong:#0E6A82; --taken:#FF6B5E;
    --line:#2C3847; --y1:#6FA4FF; --y1-soft:#1B2B4A; --y2:#5CCBE6; --y2-soft:#16333D;
    --ok:#7BC795; --ok-soft:#1B3325; --err:#FF8A80; --err-soft:#3A1F1D; --warn:#F1D98B; --warn-soft:#3A3016; --warn-line:#5A4A1E;
    --brand:linear-gradient(180deg,#0A7FC0 0%,#1450C8 100%);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Quicksand",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;font-weight:500;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
@media (min-width:560px){
  body{padding:24px 0}
  .app{min-height:calc(100vh - 48px);border-radius:28px;box-shadow:0 20px 60px rgba(18,35,61,.18);overflow:hidden;border:1px solid var(--line)}
}
/* Barre */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;background:var(--brand);color:#fff}
.bar h1{flex:1;margin:0;text-align:center;font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sub{display:block;font-size:12.5px;font-weight:600;opacity:.92}
.iconbtn{width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:rgba(255,255,255,.14)}
.iconbtn svg{width:22px;height:22px}
.spacer{width:44px;flex:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{flex:1;padding:16px 16px calc(env(safe-area-inset-bottom) + 28px)}
/* Accueil */
.hero{padding:24px 8px 18px;text-align:center}
.logo{display:block;width:120px;height:120px;margin:0 auto 16px;border-radius:27px;box-shadow:0 10px 28px rgba(22,104,242,.28)}
.hero h2{margin:0;font-size:38px;font-weight:700;line-height:1.1}
.hero .tag1{margin:10px 0 0;font-size:19px;font-weight:700;color:var(--y1)}
.hero .tag2{margin:4px 0 0;color:var(--ink-2);font-weight:600;font-size:15px}
.choices{display:grid;gap:14px;margin-top:18px}
.card{display:flex;align-items:center;gap:16px;width:100%;padding:18px;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--shadow);text-align:left;cursor:pointer;text-decoration:none;color:inherit;transition:transform .12s ease}
.card:active{transform:scale(.985)}
.card .num{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:30px;font-weight:700;flex:none}
.card.y1 .num{background:var(--y1-soft);color:var(--y1)}
.card.y2 .num{background:var(--y2-soft);color:var(--y2)}
.card .t{font-weight:700;font-size:19px}
.card .d{color:var(--muted);font-size:14px}
.chev{margin-left:auto;color:var(--muted);flex:none}
.foot{margin-top:26px;text-align:center}
.linkbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border-radius:12px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:14.5px}
.linkbtn:hover{background:var(--surface)}
.linkbtn svg{width:18px;height:18px}
.credit{margin:4px 0 0;color:var(--ink-2);font-size:12px;font-weight:600}
.kicker{margin:6px 4px 10px;font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
/* Liste des khôlles */
.list{display:grid;gap:10px}
.qcard{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);text-decoration:none;color:inherit;min-height:68px}
.qcard.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.qcard.past{background:var(--surface-2)}
.qnum{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-weight:700;font-size:20px;background:var(--accent-soft);color:var(--accent);flex:none}
.qcard.past .qnum{background:var(--line);color:var(--muted)}
.qt{font-weight:700;font-size:17px}
.qd{font-size:13.5px;color:var(--muted)}
.qbody{display:block;flex:1;min-width:0}
.qpills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.free{background:var(--ok-soft);color:var(--ok)}
.pill.full,.pill.done{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.soon{background:var(--warn-soft);color:var(--warn)}
.pill.now{background:var(--accent);color:#fff}
.toggle{display:block;margin:4px auto 12px;border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:10px;min-height:44px}
/* Quinzaine */
.rule{display:flex;gap:10px;align-items:flex-start;margin:0 0 16px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.rule svg{width:20px;height:20px;flex:none;color:var(--accent);margin-top:1px}
.weekhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 4px 10px}
.weekhead:first-of-type{margin-top:4px}
.weekhead h3{margin:0;font-size:19px;font-weight:700}
.weekhead h3 small{display:block;font-size:13.5px;color:var(--muted);font-weight:600}
.dayname{margin:14px 4px 8px;font-weight:700;font-size:15px;color:var(--ink-2)}
.group{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px}
.ghead{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--head);color:#fff}
.ghead .who{font-weight:700;font-size:16.5px}
.room{margin-left:auto;padding:4px 10px;border-radius:8px;background:#fff;color:var(--head);font-weight:700;font-size:13px;letter-spacing:.4px}
.slot{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}
.slot:first-of-type{border-top:0}
.slot:hover{background:var(--surface-2)}
.slot .time{font-variant-numeric:tabular-nums;font-weight:700;min-width:118px}
.slot .state{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;text-align:right}
.slot .dot{width:10px;height:10px;border-radius:50%;flex:none}
.slot.free .dot{background:var(--ok)}
.slot.free .state{color:var(--ok);font-weight:700}
.slot.taken .dot{background:var(--taken)}
.slot.taken .state{font-weight:700}
.slot.locked{cursor:default}
.slot.locked:hover{background:transparent}
.slot.locked .time{color:var(--muted);font-weight:600}
.slot.locked .state{color:var(--muted);font-weight:600}
.slot.locked .dot{background:var(--line)}
.slot.locked.taken .state{color:var(--ink-2)}
.slot svg.lock{width:15px;height:15px;flex:none}
.alert{display:flex;gap:10px;align-items:flex-start;margin:0 0 14px;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.45}
.alert svg{width:20px;height:20px;flex:none;margin-top:1px}
.alert.warn{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-line)}
.alert.err{background:var(--err-soft);color:var(--err);border:1px solid var(--err)}
.alert.info{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.alert b{font-weight:700}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:16px}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px;color:var(--muted)}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Feuille */
.scrim{position:fixed;inset:0;background:rgba(10,15,22,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:480px;max-height:92vh;overflow:auto;transform:translate(-50%,105%);visibility:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1),visibility 0s linear .25s;z-index:21;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 22px);box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet.open{transform:translate(-50%,0);visibility:visible;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h4{margin:0;font-size:22px;font-weight:700}
.meta{margin:6px 0 16px;color:var(--ink-2);font-size:15px}
.meta b{color:var(--ink)}
label.lbl{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.selectwrap{position:relative}
select,input.field{width:100%;min-height:52px;padding:12px 44px 12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);font-size:17px;font-weight:600;appearance:none;-webkit-appearance:none}
input.field{padding-right:14px}
select{cursor:pointer}
select:focus,input.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.selectwrap svg{position:absolute;right:14px;top:50%;width:20px;height:20px;transform:translateY(-50%);pointer-events:none;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.msg{margin-top:12px}
.actions{display:grid;gap:10px;margin-top:18px}
.btn{min-height:52px;border-radius:14px;border:0;font-weight:700;font-size:16px;cursor:pointer;padding:0 18px}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:disabled,.btn.outline:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink-2)}
.btn.outline{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.warnbtn{background:#B45309;color:#fff}
.btn.warnbtn:disabled{opacity:.45;cursor:not-allowed}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--surface-2);font-size:14.5px;cursor:pointer;margin-bottom:14px}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.divider{height:1px;background:var(--line);margin:18px 0}
/* Journal */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.filters .full{grid-column:1 / -1}
.filters select,.filters input.field{min-height:46px;font-size:15px;border-radius:12px}
.entry{padding:12px 14px;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.entry .when{font-size:13px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.entry .who{font-weight:700;margin-top:4px}
.entry .what{font-size:13.5px;color:var(--ink-2)}
.entry .dev{font-size:12px;color:var(--muted)}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.badge.b-book{background:var(--ok-soft);color:var(--ok)}
.badge.b-cancel{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.badge.b-replace{background:var(--warn-soft);color:var(--warn)}
.count{font-size:13px;color:var(--muted);margin:0 4px 8px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin-bottom:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.tab{min-height:44px;border:0;border-radius:10px;background:transparent;font-weight:700;color:var(--ink-2);cursor:pointer}
.tab.on{background:var(--accent);color:#fff}
.btn.outline.danger{color:var(--err);border-color:var(--err)}
.btn.danger-fill{background:#B42318;color:#fff}
.btn.danger-fill:disabled{opacity:.45;cursor:not-allowed}
/* Mise à jour */
#updateBar{position:sticky;top:64px;z-index:6;padding:10px 12px 0}
.upd{position:relative;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;padding:14px 14px 14px;border-radius:16px;background:var(--ink);color:#fff;box-shadow:0 10px 30px rgba(18,35,61,.3)}
.upd-ico{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.upd-ico svg{width:22px;height:22px}
.upd-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;font-size:14px}
.upd-body b{font-size:15.5px}
.upd-body details{margin-top:4px;font-size:13px;opacity:.9}
.upd-body summary{cursor:pointer;font-weight:700;text-decoration:underline}
.upd-body{padding-right:28px}
.upd-actions{width:100%;display:flex}
.upd-actions .btn{flex:1}
.upd-close{position:absolute;top:8px;right:6px}
.upd .btn.primary{min-height:40px;padding:0 14px;font-size:14px;background:#1668F2}
.upd-close{border:0;background:none;color:#fff;font-size:22px;line-height:1;cursor:pointer;width:40px;height:32px;opacity:.7}
@media (prefers-color-scheme: dark){.upd{background:#EEF2F7;color:#10161F}.upd-ico{background:rgba(0,0,0,.08)}.upd-close{color:#10161F}}
/* Ressources */
.sep{height:1px;background:var(--line);margin:26px 8px 18px}
.card.res .num{background:#FFEDD5;color:#C2410C}
.subjects{display:grid;gap:12px}
.card.subj{padding:14px 16px}
.card.subj .num{width:48px;height:48px;border-radius:14px;font-size:17px;letter-spacing:.5px;background:var(--accent-soft);color:var(--accent)}
.card.subj.off{opacity:.55;box-shadow:none;cursor:default}
.card.subj .num.emo{font-size:26px;letter-spacing:0}
.card.subj.off .num{background:var(--surface-2);color:var(--muted)}
.card.alerts{margin-top:14px;font:inherit;line-height:1.45}
#wantAlerts svg{width:18px;height:18px;vertical-align:-3px;margin-right:4px}
.card.alerts .num{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.card.alerts .num svg{width:28px;height:28px}
.card.alerts.on .num{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.card.alerts.on .d{color:var(--ok);font-weight:700}
.alert.ok{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok)}
#sheetTitle svg{width:20px;height:20px;vertical-align:-3px;margin-right:4px}
.card.res .num svg{width:30px;height:30px}
.res-intro{margin:4px 4px 16px;color:var(--ink-2);font-weight:600}
.respart{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px}
.respart .ghead{background:#C2410C}
.restext{margin:0;padding:14px 16px 4px;color:var(--ink-2);font-size:15px}
.wip{display:flex;align-items:center;gap:12px;margin:12px 16px 16px;padding:14px 16px;border-radius:14px;border:1.5px dashed #F5B98A;background:#FFF7ED;color:#9A3412}
.wip svg{width:26px;height:26px;flex:none}
.wip b{font-size:16px}
.wip small{color:#B45309;font-weight:600}
details.txt{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
details.txt>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 14px 14px 12px;cursor:pointer}
details.txt>summary::-webkit-details-marker,details.tpart>summary::-webkit-details-marker{display:none}
details.txt>summary .num{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:#FFEDD5;color:#C2410C;font-weight:700}
details.txt .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
details.txt .tt .t{font-weight:700;line-height:1.25;color:var(--ink)}
details.txt .tt .d{font-size:13px;color:var(--ink-2);font-weight:600}
details.txt>summary>svg,details.tpart>summary>svg{flex:none;width:18px;height:18px;color:#C2410C;transition:transform .2s}
details[open]>summary>svg{transform:rotate(180deg)}
details.txt[open]>summary{border-bottom:1px solid var(--line);background:#FFF7ED}
.tparts{padding:8px}
details.tpart{border-radius:12px;margin:4px 0}
details.tpart>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 10px;cursor:pointer;border-radius:12px;font-weight:700;color:var(--ink)}
details.tpart>summary:hover{background:#FFF7ED}
details.tpart[open]>summary{background:#C2410C;color:#fff}
details.tpart[open]>summary>svg{color:#fff}
details.tpart .pn{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:#FFEDD5;color:#C2410C;font-size:13px}
details.tpart .pn svg{width:16px;height:16px}
details.tpart[open] .pn{background:rgba(255,255,255,.22);color:#fff}
details.tpart .pl{flex:1}
details.tpart .pl small{font-weight:600;opacity:.75;font-size:12px;margin-left:4px}
.tbody{padding:12px 8px 6px;font-size:15px;line-height:1.6;color:var(--ink)}
.tbody p{margin:0 0 12px}
.tbody h4{margin:14px 0 8px;color:#C2410C;font-size:15px}
.tbody h4:first-child{margin-top:2px}
.tbody ul{margin:0 0 12px;padding-left:20px}
.tbody li{margin:0 0 6px}
.tbody .wip{margin:0 0 6px}
.article mark{background:transparent;color:inherit;padding:0 1px;border-radius:3px;transition:background .15s,box-shadow .15s}
.article.show-be mark.be{background:#c8a80047;box-shadow:0 0 0 1px #b89600 inset}
.article.show-num mark.num{background:#c8507a38;box-shadow:0 0 0 1px #c8507a inset}
.article.show-prop mark.prop{background:#2a7a4b3d;box-shadow:0 0 0 1px #2a7a4b inset}
.article.show-conn mark.conn{background:#6b4ea038;box-shadow:0 0 0 1px #6b4ea0 inset;font-weight:600}
.hl-legend{display:flex;flex-wrap:wrap;gap:8px;padding:12px 12px 4px;margin:6px 0 8px;border:1px solid var(--line);border-radius:12px;background:#FCFBF8}
.hl-legend .lgl{width:100%;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.hl-btn{--cc:#888;cursor:pointer;font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:18px;padding:6px 13px;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.hl-btn .sw{width:12px;height:12px;border-radius:3px;background:var(--cc)}
.hl-btn[data-k="be"]{--cc:#c8a800}.hl-btn[data-k="num"]{--cc:#c8507a}.hl-btn[data-k="prop"]{--cc:#2a7a4b}.hl-btn[data-k="conn"]{--cc:#6b4ea0}
.hl-btn[aria-pressed="true"]{color:var(--cc);border-color:currentColor;background:#fff}
.hl-btn[data-k="be"][aria-pressed="true"]{color:#8a7400;background:#fbf6dc}
.hl-btn[data-k="num"][aria-pressed="true"]{background:#fbeef3}
.hl-btn[data-k="prop"][aria-pressed="true"]{background:#eef6f1}
.hl-btn[data-k="conn"][aria-pressed="true"]{background:#f3f0f9}
.hl-why{width:100%;margin:6px 0 8px;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.hl-why b{color:#C2410C}
.cr-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:2px 0 12px}
.cr-stat{background:#fff;border-radius:12px;padding:12px 6px 10px;text-align:center;box-shadow:0 2px 10px rgba(26,39,68,.08);border:1px solid var(--line);border-top:4px solid #C2410C}
.cr-stat:nth-child(2){border-top-color:#2d5fa6}.cr-stat:nth-child(3){border-top-color:#2a7a4b}
.cr-stat .n{font-weight:700;font-size:1.45rem;line-height:1;color:#1a2744}
.cr-stat .n{white-space:nowrap}
.cr-stat .n.long{font-size:1.1rem}
.cr-stat .n small{font-size:.55em;color:#C2410C;margin-left:1px}
.cr-stat .l{font-size:11.5px;line-height:1.3;color:var(--ink-2);margin-top:6px;font-weight:600}
.cr-meta{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.cr-chip{font-size:12px;font-weight:700;color:#1a2744;background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 11px}
.cr-chip.lvl{background:#C2410C;border-color:#C2410C;color:#fff}
.cr-era{position:relative;padding-left:28px;margin-top:18px}
.cr-era::before{content:"";position:absolute;left:7px;top:14px;bottom:-22px;width:2px;background:var(--line)}
.cr-era:last-child::before{bottom:0}
.cr-era::after{content:"";position:absolute;left:0;top:5px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #C2410C}
.cr-lab{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:#1a2744;border-radius:6px;padding:3px 9px;margin-bottom:6px}
.tbody .cr-era h4{margin:0 0 6px;color:#1a2744;font-size:16px}
.tbody .cr-era p{margin:0}
.tbody .cr-era strong{color:#1a2744;background:linear-gradient(transparent 62%,#FFEDD5 62%)}
.tbody p.dc::first-letter{font-weight:700;color:#C2410C;font-size:2.6em;line-height:.8;float:left;margin:5px 8px 0 0}
.vwrap{position:relative;width:100%;border-radius:12px;overflow:hidden;background:#0f1a33;box-shadow:0 2px 12px rgba(26,39,68,.18);margin:2px 0 10px}
.vwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
details.vscript{margin:4px 0 6px}
details.vscript>summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;padding:10px 14px;border-radius:12px;border:1.5px solid #C2410C;color:#C2410C;font-weight:700;background:#FFF7ED}
details.vscript>summary::-webkit-details-marker{display:none}
details.vscript>summary svg{width:18px;height:18px;flex:none}
details.vscript>summary span{flex:1}
details.vscript>summary .off,details.vscript[open]>summary .on{display:none}
details.vscript[open]>summary .off{display:inline}
details.vscript[open]>summary{margin-bottom:12px}
details.vscript[open]>summary>svg:last-child{transform:rotate(180deg)}
.tbody .lead{font-style:italic;color:var(--ink-2)}
.tbody .note{font-size:13px;color:var(--ink-2);font-style:italic;margin-top:-4px}
.tbody .pb{background:#FFF7ED;border-left:3px solid #C2410C;padding:10px 12px;border-radius:8px}
.tbody .pb b{color:#C2410C}
@media (prefers-color-scheme: dark){
  .wip{background:#2A1E14;border-color:#7A4A26;color:#FDBA8C}.wip small{color:#F59E6B}
  details.txt[open]>summary,details.tpart>summary:hover{background:#2A1E14}
  .card.res .num,details.txt>summary .num,details.tpart .pn{background:#3A2416;color:#FB923C}
  details.txt>summary>svg,details.tpart>summary>svg{color:#FB923C}
  .tbody h4,.hl-why b,.tbody .pb b,.tbody p.dc::first-letter,.cr-stat .n small{color:#FB923C}
  .hl-legend{background:var(--surface-2)}
  .hl-btn{background:var(--surface);color:var(--ink)}
  .hl-btn[data-k="be"]{--cc:#E8C93A}.hl-btn[data-k="num"]{--cc:#F08DB0}.hl-btn[data-k="prop"]{--cc:#6FCF97}.hl-btn[data-k="conn"]{--cc:#B8A1E8}
  .hl-btn[data-k="be"][aria-pressed="true"]{color:#E8C93A;background:#3A3210}
  .hl-btn[data-k="num"][aria-pressed="true"]{color:#F08DB0;background:#3A1A27}
  .hl-btn[data-k="prop"][aria-pressed="true"]{color:#6FCF97;background:#15301F}
  .hl-btn[data-k="conn"][aria-pressed="true"]{color:#B8A1E8;background:#2A2140}
  .article.show-be mark.be{background:#E8C93A33;box-shadow:0 0 0 1px #E8C93A inset}
  .article.show-num mark.num{background:#F08DB033;box-shadow:0 0 0 1px #F08DB0 inset}
  .article.show-prop mark.prop{background:#6FCF9733;box-shadow:0 0 0 1px #6FCF97 inset}
  .article.show-conn mark.conn{background:#B8A1E833;box-shadow:0 0 0 1px #B8A1E8 inset}
  .cr-stat{background:var(--surface)}.cr-stat .n{color:var(--ink)}
  .cr-chip{background:var(--surface);color:var(--ink)}
  .cr-era::after{background:var(--surface)}
  .cr-lab{background:#3B4A66}
  .tbody .cr-era h4{color:var(--ink)}
  .tbody .cr-era strong{color:var(--ink);background:linear-gradient(transparent 62%,#5A2E14 62%)}
  details.vscript>summary{background:#2A1E14;color:#FB923C;border-color:#FB923C}
  .tbody .pb{background:#2A1E14}
}
/* Synchronisation discrète */
#refresh.syncing svg{animation:spin 1s linear infinite}
/* Exports */
.xrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);text-decoration:none;color:inherit;min-height:56px}
.xrow:first-child{border-top:0}
.xrow svg{width:22px;height:22px;color:var(--y1);flex:none}
.xrow small{color:var(--muted)}
/* Agenda */
.calbtns{display:grid;gap:10px}
.calbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:#111827;color:#fff;text-decoration:none}
.calbtn.alt{background:#1A73E8 !important;color:#fff !important;border:0 !important}
.calbtn.alt{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.calbtn svg{width:20px;height:20px}
.calbtn.preparing{opacity:.75}
.okmark{width:56px;height:56px;margin:4px auto 10px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.okmark svg{width:30px;height:30px}
/* Annulations */
.pill.cancel{background:var(--err-soft);color:var(--err)}
.alert.cancel{background:var(--err-soft);color:var(--err);border:1.5px solid var(--err)}
.alert.cancel a{color:inherit;font-weight:600}
.clist{margin:6px 0;padding-left:18px}
.clist li{margin:3px 0}
.clist .why{display:block;font-size:13px;opacity:.9}
.group.cancelled .ghead{background:#6B7280}
.group.cancelled .room{color:#6B7280}
.cbadge{padding:3px 8px;border-radius:999px;background:#fff;color:#B42318;font-size:12px;font-weight:700}
.cnote{padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--err);background:var(--err-soft)}
.group.cancelled .slot .time{text-decoration:line-through}
.slot.cancelled .state{color:var(--err)}
/* Espace enseignants */
.tlogin{text-align:center;padding:20px 8px 10px}
.tlogin h2{margin:10px 0 4px;font-size:26px}
.tlogin p{margin:0 0 14px;color:var(--ink-2)}
.tlock{width:64px;height:64px;margin:0 auto;border-radius:18px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.tlock svg{width:30px;height:30px}
.tcard{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--shadow);text-decoration:none;color:inherit}
.tcard .t{font-weight:700;font-size:18px}
.tcard .d{color:var(--muted);font-size:14px}
.tcbody{flex:1;min-width:0;display:block}
.ticon{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;flex:none}
.ticon svg{width:26px;height:26px}
.t-annul{background:var(--err-soft);color:var(--err)}
.t-log{background:var(--y1-soft);color:var(--y1)}
.t-guide{background:#EFE7FF;color:#7C3AED}
.t-alert{background:var(--ok-soft);color:var(--ok)}
.srow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow.is-cancelled{background:var(--err-soft)}
.sinfo{flex:1;min-width:0}
.sday{font-weight:700}
.smeta{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.sbtn{flex:none;min-height:44px;min-width:96px;padding:0 14px;border-radius:12px;font-weight:700;cursor:pointer;background:transparent}
.sbtn.cancel{border:1.5px solid var(--err);color:var(--err)}
.sbtn.restore{border:1.5px solid var(--accent);color:var(--accent);background:var(--surface)}
.badge.b-annul{background:var(--err-soft);color:var(--err)}
.selall{display:flex;align-items:center;gap:10px;min-height:44px;margin:0 2px 8px;padding:0 12px;font-weight:700;font-size:14.5px;cursor:pointer}
.selall .muted{color:var(--muted);font-weight:600}
.selall input,.pickbox{width:20px;height:20px;margin:0;accent-color:var(--accent);flex:none;cursor:pointer}
.entry.pick{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.entry.pick .pickbox{margin-top:3px}
.entry.picked{background:var(--accent-soft)}
.ebody{flex:1;min-width:0;display:block}
.ebody > span{display:block}
.ebody .top{display:flex}
.selbar{position:sticky;bottom:0;display:grid;gap:10px;margin:16px -16px 0;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);background:var(--bg);border-top:1px solid var(--line)}
/* Toast */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translate(-50%,140%);visibility:hidden;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;z-index:30;transition:transform .25s,visibility 0s linear .25s;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast.show{transform:translate(-50%,0);visibility:visible;transition:transform .25s}
/* ===== Version 2 : comptes, Ma page, places multiples, enseignants, Gestion ===== */
.muted{color:var(--muted)}
.btn svg{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
.btn{display:inline-flex;align-items:center;justify-content:center}
.sbtn:not(.cancel):not(.restore){border:1.5px solid var(--line);color:var(--ink-2);background:var(--surface)}
.band{display:flex;gap:10px;align-items:center;margin:10px 0;padding:10px 14px;border-radius:14px;background:var(--warn-soft);color:var(--warn);font-size:14px;border:1px solid var(--warn-line)}
.band svg{width:18px;height:18px;flex:none}
.band b{font-weight:700}
.list .band,.plist .band{margin:2px 0}
.lisere-wrap{margin:8px -4px 0;color:#B9B3CF}
.lisere{display:block;width:100%;height:auto}
@media (prefers-color-scheme: dark){.lisere-wrap{color:#3A4456}}
.linkbtn.faint{color:var(--muted);font-size:13px;min-height:36px}

.scell{position:relative}

.pill.mine{background:var(--ok);color:#fff}

.slot.multi{flex-wrap:wrap}
.snames{flex-basis:100%;font-size:12.5px;color:var(--muted);margin-top:-2px}
.seats{display:inline-flex;gap:3px}

.fillcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:14px}

.chip{min-height:38px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:13.5px;color:var(--ink-2);cursor:pointer}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}

.stats b.ok{color:var(--ok)}.stats b.err{color:var(--err)}
.tslot .state{text-align:right}
.capn{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:2px 7px}
.agrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.acell{display:flex;flex-direction:column;gap:4px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:inherit;text-decoration:none;text-align:left;font:inherit;line-height:1.35;cursor:pointer;box-shadow:var(--shadow)}

.trow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}

.trow span{flex:1;font-weight:700}
.trow .sbtn{min-height:38px;min-width:0}
.srow2{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);font-size:14px}

.sx{display:block;width:max-content;font-size:12px;font-weight:700;color:var(--accent);margin-bottom:2px}
.sacts{display:flex;flex-direction:column;gap:6px}

.stepper{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:0 4px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface-2)}

#sheet .lbl{margin-top:12px}

.actbox small{opacity:.75}

.grow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}

.gname{flex:1;min-width:0;font-size:13px}

.st{font-weight:700}
.st.ok{color:var(--ok)}.st.warn{color:var(--warn)}.st.err{color:var(--err)}
.gseg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}

.codebox{margin:14px 0;padding:16px;border-radius:14px;border:1.5px dashed var(--line);background:var(--surface-2);text-align:center;font-size:30px;font-weight:700;letter-spacing:4px;font-family:ui-monospace,Menlo,monospace}

.vrow .sbtn{justify-self:start;min-height:36px}

.newpill{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:#E11D48;color:#fff;font-size:11.5px;font-weight:700;vertical-align:2px;letter-spacing:.2px}

.dgroup{margin-bottom:6px}

.drow>svg{width:18px;height:18px;color:var(--muted);flex:none}

.dico.met{background:#FFEDD5;color:#C2410C}
.dico svg{width:22px;height:22px}
.dbody{flex:1;min-width:0;line-height:1.35}
.dbody b{font-size:15px}
.dbody small{color:var(--muted);font-size:12.5px}
.drow2{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);padding-right:12px}
.drow2 .drow{border-top:0}
.drow2 .sbtn{min-height:36px;min-width:0;padding:0 10px}
.tab:disabled{opacity:.4;cursor:not-allowed}

#sheet h4 svg{width:20px;height:20px;vertical-align:-3px}
/* Alertes par type, échanges */
.ntogs{display:grid;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface);margin:12px 0}
.ntogs.off{opacity:.6}
.ntog{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;font-size:14.5px;line-height:1.35}
.ntog:first-child{border-top:0}
.ntog>span{flex:1}
.ntog small{color:var(--muted);font-size:12.5px}
.ntog input{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;margin:0}
.ntog input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.ntog input:checked{background:var(--ok)}
.ntog input:checked::after{transform:translateX(18px)}
.ntog input:disabled{cursor:not-allowed}
.alert.swapc{background:#EDE9FE;color:#4C1D95;border:1px solid #C4B5FD}
.alert.swapc a{color:inherit}
.alert.swapc .clist li{margin-top:6px}
.sbtn.swapbtn{min-height:34px;min-width:0;padding:0 10px;margin-left:4px;border:1.5px solid #7C3AED;color:#6D28D9;background:#fff}
.swlist .check{margin-bottom:8px}
.swlist small{color:var(--muted)}
.swapgrid{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:12px 0}
.swapgrid>div{padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-size:13.5px;line-height:1.4}

.swapgrid small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
.swapgrid b{display:block;font-size:14.5px}
.swarrow svg{width:22px;height:22px;color:#7C3AED}

/* Notes */
a.btn{text-decoration:none;justify-content:center}
.npill{flex:none;min-width:44px;height:30px;padding:0 8px;border-radius:999px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--warn-soft);color:var(--warn)}
.npill.ok{background:var(--ok-soft);color:var(--ok)}
.npill svg{width:16px;height:16px}
.nhead{padding:12px 14px;margin-bottom:10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px;line-height:1.5;color:var(--ink-2)}
.nhead b{color:var(--ink);font-size:15.5px}
.nrow{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.nrow:first-child{border-top:0}
.nwho{flex:1;min-width:0;line-height:1.25}
.nwho small{display:block;color:var(--muted);font-size:12px;font-weight:700}
.nwho b{font-size:15.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ninput{width:68px;height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface-2);font:inherit;font-size:22px;font-weight:700;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums}
.ninput:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.ninput:disabled{opacity:.7}
.ninput::placeholder{color:var(--muted);font-size:17px}
.nsur{color:var(--muted);font-weight:700;font-size:13px;margin-left:-4px}
.nabs{height:40px;padding:0 9px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.nabs.on{background:var(--err);border-color:var(--err);color:#fff}
.nstate{width:20px;display:grid;place-items:center;color:var(--ok)}
.nstate svg{width:18px;height:18px}
.nstate.err{color:var(--err)}
.spin.sm{width:14px;height:14px;border-width:2px;margin:0}
.gtable{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.gtable table{border-collapse:collapse;font-size:13px;min-width:100%}
.gtable th,.gtable td{padding:8px 8px;border-top:1px solid var(--line);text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.gtable thead th{border-top:0;background:var(--surface-2);font-size:12px;color:var(--muted)}

.gtable td.abs{color:var(--err);font-weight:700}
.gtable td.avg{font-weight:700;color:var(--accent)}
.trow small.st{flex:none;text-align:right;font-size:12.5px;max-width:58%}

.ghead{flex-wrap:wrap}
.ghead .topic{order:9;flex:1 1 100%;min-width:0;font-size:13.5px;line-height:1.35;padding:4px 9px;border-radius:9px;background:rgba(255,255,255,.18)}
.ghead .topic b{font-weight:700}
.topicbtn{display:inline-flex;align-items:center;gap:5px;min-height:32px;padding:0 9px;border:1.5px solid rgba(255,255,255,.7);border-radius:9px;background:transparent;color:#fff;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;flex:none}
.topicbtn svg{width:15px;height:15px}
.ghead .topicbtn + .room{margin-left:0}
.ghead .topic + .room{margin-left:auto}
.ghead .topic + .topicbtn{margin-left:auto}
.ghead .who + .topicbtn{margin-left:auto}
.topicline{margin:-4px 0 12px;padding:9px 12px;border-radius:12px;background:var(--accent-soft);color:var(--ink);font-size:14px}
.nk-topic{display:block;margin-top:6px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.18);font-size:14px;line-height:1.35}
.openbar{display:flex;align-items:center;gap:10px;margin:-2px 0 12px;padding:10px 12px;border-radius:14px;background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--warn);font-size:13.5px;font-weight:700}
.openbar>span{flex:1;display:flex;align-items:center;gap:6px}.openbar svg{width:16px;height:16px;flex:none}
.openbar .sbtn{min-height:36px;min-width:0;padding:0 12px;border:1.5px solid var(--warn);color:var(--warn);background:var(--surface)}
/* Remplissage des créneaux à plusieurs places */
.slot .seats i{background:var(--ok)}

.slot .dot.f-full{width:auto;height:auto;border-radius:0;background:none;font-size:14px;line-height:1}
.slot .dot.f-full::before{content:"\274C"}
.slot.cancelled .seats i,.slot.locked.cancelled .dot{background:var(--line)}
/* Aperçu administrateur */
#pvbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:60;display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-radius:16px;background:#12233D;color:#fff;font-size:13.5px;box-shadow:0 10px 28px rgba(0,0,0,.3)}
#pvbar span{flex:1;min-width:0}
#pvbar button{flex:none;min-height:36px;padding:0 14px;border:0;border-radius:10px;background:#fff;color:#12233D;font:inherit;font-weight:700;cursor:pointer}
body.previewing #view{padding-bottom:84px}
/* Tout mon planning */
.fullplan{margin-top:12px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.fullplan>summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;font-weight:700;font-size:15.5px;cursor:pointer;list-style:none}
.fullplan>summary::-webkit-details-marker{display:none}
.fullplan>summary span{display:flex;align-items:center;gap:8px}
.fullplan>summary svg{width:20px;height:20px;color:var(--accent);transition:transform .2s}
.fullplan[open]>summary>svg{transform:rotate(180deg)}
.fullplan>.tabs{margin:0 12px 12px}
.fullplan>.plist,.fullplan>.pl-list,.fullplan>.empty{margin:0 12px 12px}
.pl-list{display:grid;gap:12px}
.pl-subj{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pl-h{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:var(--surface-2);font-weight:700;font-size:14.5px}
.pl-h small{color:var(--muted);font-size:12px}
.pl-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);text-decoration:none;color:inherit;font-size:13.5px;line-height:1.3}
.pl-k{flex:none;width:34px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12.5px}
.pl-b{flex:1;min-width:0}.pl-b small{color:var(--muted)}
.pl-s{flex:none;font-size:12px;font-weight:700;text-align:right;max-width:44%}
.pl-s.ok{color:var(--ok)}.pl-s.ok svg{width:18px;height:18px}
.pl-s.todo{color:#fff;background:var(--accent);padding:4px 9px;border-radius:999px}
.pl-s.wait{color:var(--muted)}
.pl-row.ok .pl-k{background:var(--ok-soft);color:var(--ok)}
</style>
</head>

    && (!s.from || k >= s.from) && (!s.until || k <= s.until)).concat(ponct);
}

// Fréquence = effectif de la liste ÷ places moyennes par khôlle : si 21 étudiants pour 12 places, chacun passe une khôlle sur deux.
function kholleEvery(year){
  const ks = khollesFor(year).filter(k => k.slots.length), n = (CONFIG.YEARS[year].students || []).length;
  if (!ks.length || !n) return 1;
  const cap = ks.reduce((a, k) => a + k.slots.reduce((x, s) => x + s.cap, 0), 0) / ks.length;
  return Math.max(1, Math.round(n / Math.max(1, cap)));   // 18 élèves / 17 places → 1 ; 21 / 12 → 2
}
// Rappels masqués par l'étudiant (« Je n'ai pas besoin de m'inscrire à cette khôlle »), sur cet appareil
const SKIP = {
  all(){ return store.get("khollapp-skip") || {}; },
  has(name, year, q){ return !!((this.all()[name] || {})[year + "|" + q]); },
  set(name, year, q, on){ const a = this.all(), m = a[name] || {}; if (on) m[year + "|" + q] = Date.now(); else delete m[year + "|" + q]; a[name] = m; store.set("khollapp-skip", a); }
};
function toBookFor(year, name, now = new Date(), ignoreSkip = false){
  const mineQ = new Set(allBookings(year).filter(b => b.student === name).map(b => Number(b.q))), every = kholleEvery(year);
  const near = (n) => { for (let i = 1; i < every; i++) if (mineQ.has(n - i) || mineQ.has(n + i)) return true; return false; };
  // Khôlle en cours : la première qui a encore des créneaux à venir. Si elle est complète, on passe à la suivante.
  for (const k of khollesFor(year).filter(k => k.slots.some(s => s.startsAt > now))) {
    if (mineQ.has(k.n) || near(k.n)) return null;            // inscrit (ou inscrit dans la même période) : pas de rappel
    const mine = k.slots.filter(s => s.startsAt > now && (!s.only || s.only.includes(name)));
    if (mine.some(s => slotStatus(s, now) === "open" && takers(s).length < s.cap)) return (!ignoreSkip && SKIP.has(name, year, k.n)) ? null : k;
    if (mine.some(s => slotStatus(s, now) === "notyet")) return null;   // pas encore ouverte
  }
  return null;
}
function windowKholles(year, now = new Date()){ return khollesFor(year).filter(k => k.slots.length && inWindow(k.slots[0], now)); }
const openLabel = (s) => fmtDate(s.opensAt) + " entre " + hourWin(s.openHour ?? CONFIG.OPEN_FROM_HOUR);
const openShort = (s) => { const h = s.openHour ?? CONFIG.OPEN_FROM_HOUR; return inWindow(s) ? "Ouverture imminente" : "Ouverture le " + fmtDate(s.opensAt) + " · " + h + "h–" + (h + 1) + "h"; };
const dayFrozen = (d, now = new Date()) => now >= addDays(d, 1);
const describeSlot = (id) => { const s = SLOT_INDEX[id]; return s ? `${fmtDay(s.date).toLowerCase()}, ${s.label} (${exName(s.year, s.examiner)}, salle ${s.room})` : id; };
// Chevauchement avec une khôlle d'une autre matière : même étudiant, même promotion, même jour, horaires qui se recouvrent.
function crossConflictMsg(s, student, ignore = []){
  const promo = promoOf(s.year);
  const hit = Object.keys(CONFIG.YEARS).filter(y => promoOf(y) === promo).flatMap(allBookings).find(b => {
    if (b.student !== student || b.slotId === s.id || ignore.includes(b.slotId)) return false;
    const o = SLOT_INDEX[b.slotId];
    return o && o.dateISO === s.dateISO && o.start < s.start + s.dur && s.start < o.start + o.dur;
  });
  if (!hit) return null;
  const o = SLOT_INDEX[hit.slotId];
  return `<b>Inscription impossible.</b> ${esc(student)} a déjà une <b>khôlle ${esc(deLabel(CONFIG.YEARS[o.year].subjectLabel))}</b> ce jour-là, de ${esc(o.label.replace(" – ", " à "))} (${esc(exName(o.year, o.examiner))}, salle ${esc(o.room)}).<br>Les deux créneaux se chevauchent : choisissez un autre créneau.`;
}

/* ---------- Échanges avec le serveur ---------- */
async function postJSON(p, timeoutMs = 30000){
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), timeoutMs);
  let res;
  try { res = await fetch(CONFIG.API_URL, { method: "POST", body: JSON.stringify(p), signal: ctrl.signal }); }
  catch(e){ const err = new Error(e.name === "AbortError" ? "délai dépassé (30 s)" : "réseau indisponible"); err.network = true; throw err; }
  finally { clearTimeout(t); }
  const txt = await res.text();
  try { return JSON.parse(txt); }
  catch(e){ const err = new Error("réponse inattendue du serveur (HTTP " + res.status + ")"); err.network = true; throw err; }
}
const API = {
  async get(params){
    const qs = Object.entries(params).filter(([, v]) => v != null && v !== "").map(([k, v]) => k + "=" + encodeURIComponent(v)).join("&");
    const r = await fetch(CONFIG.API_URL + "?" + qs, { cache: "no-store" });
    return r.json();
  },
  async list(year){
    const win = windowKholles(year);
    const check = win.map(k => k.n + ":" + k.slots[0].first).join(",");
    const j = await this.get({ action: "list", year, check });
    if (!j.ok) throw new Error(j.error || "Erreur serveur");
    return { bookings: j.bookings, cancels: j.cancels || [], opened: j.opened || {}, swaps: j.swaps || [], topics: j.topics || [] };
  },
  post(p){ p.device = DEVICE; return postJSON(p); }
};

function applyServerConfig(r){
  if (r.cfg && r.cfg.years){
    CONFIG.YEARS = r.cfg.years; CONFIG.CLOSED = r.cfg.closed || []; CONFIG.SUBJECTS = r.cfg.subjects || CONFIG.SUBJECTS;
    SERVER_CFG = true;
  }
  if (r.students && Object.keys(r.students).length) STUDENTS = r.students;
  if (Array.isArray(r.teachers)) TEACHERS = r.teachers;
  seedStudentsFallback();
  normalizeConfig();
  rebuildAll();
}
async function loadConfig(){
  const r = await API.get({ action: "config" });
  if (!r.ok) throw new Error(r.error || "Erreur serveur");
  store.set("khollapp-config", { cfg: r.cfg, students: r.students, teachers: r.teachers });
  applyServerConfig(r);
  return r;
}

const b64uBytes = (str) => { str = str.replace(/-/g, "+").replace(/_/g, "/"); const bin = atob(str + "===".slice((str.length + 3) % 4)); return Uint8Array.from(bin, c => c.charCodeAt(0)); };
const PUSH = {
  isIOS: /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1),
  supported: () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window,
  standalone: () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true,
  get(k){ return store.get(k); }, set(k, v){ store.set(k, v); },
  reg: null,
  async register(){
    if (!("serviceWorker" in navigator)) return null;
    try { this.reg = await navigator.serviceWorker.register("sw.js"); } catch(e){ this.reg = null; }
    return this.reg;
  },
  async subscription(){
    const reg = this.reg || await this.register() || await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub){
      const j = await API.get({ action: "vapid" });
      if (!j.ok) throw new Error(j.error || "Serveur indisponible");
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uBytes(j.key) });
    }
    return sub;
  },
  async enable(payload){
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { const e = new Error(perm); e.perm = perm; throw e; }
    const sub = await this.subscription();
    const r = await postJSON(Object.assign({ sub: sub.toJSON() }, payload));
    if (!r.ok) throw new Error(r.error || "Erreur serveur");
    return true;
  },
  async disable(){
    try {
      const reg = this.reg || await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if (sub){ await postJSON({ action: "unsubscribe", endpoint: sub.endpoint }).catch(() => {}); await sub.unsubscribe(); }
    } catch(e){}
  }
};

function applyState(year, r){
  const map = {}; (r.bookings || []).forEach(b => (map[b.slotId] = map[b.slotId] || []).push(b));
  const cmap = {}; (r.cancels || []).forEach(c => cmap[c.sid] = c);
  state.bookings[year] = map; state.cancels[year] = cmap; state.loaded[year] = Date.now();
  if (Array.isArray(r.swaps)){ state.swaps = state.swaps || {}; state.swaps[year] = r.swaps; }
  if (Array.isArray(r.topics)){ const tm = {}; r.topics.forEach(t => tm[t.sid] = t.text); state.topics = state.topics || {}; state.topics[year] = tm; }
  if (r.opened) state.opened[year] = Object.assign(state.opened[year] || {}, r.opened);
  try { localStorage.setItem("khollapp-cache2-" + year, JSON.stringify({ bookings: r.bookings || [], cancels: r.cancels || [], swaps: r.swaps || [], topics: r.topics || [] })); } catch(e){}
}
Object.keys(CONFIG.YEARS).forEach(y => {
  try { const c = JSON.parse(localStorage.getItem("khollapp-cache2-" + y) || "null"); if (c){ applyState(y, c); state.loaded[y] = 0; } } catch(e){}
});
const inflight = {};
async function loadBookings(year, force){
  if (!force && state.loaded[year] && Date.now() - state.loaded[year] < 15000) return;
  if (inflight[year]) return inflight[year];
  inflight[year] = (async () => { try { applyState(year, await API.list(year)); } finally { delete inflight[year]; } })();
  return inflight[year];
}
function syncing(on){ const b = $("#refresh"); if (b) b.classList.toggle("syncing", on); }

let cfgChecked = 0;
async function route(force){
  clearInterval(state.poll);
  // Configuration revérifiée au plus toutes les 2 minutes (ou à l'actualisation)
  if (force || Date.now() - cfgChecked > 120000){
    cfgChecked = Date.now();
    loadConfig().then(() => { if (force) return; const h = location.hash; if (!$("#sheet").classList.contains("open") && !document.activeElement.matches("input,textarea,select")) { if (location.hash === h) draw(); } }).catch(() => {});
  }
  return draw(force);
}
async function draw(force){
  previewBanner();
  const [p0, sub, n] = parts();
  if (p0 === "journal"){ location.replace("#/prof/journal"); return; }
  if (p0 === "gestion") return renderGestionRoute(sub, force);
  if (p0 === "prof") return renderProfRoute(sub, force);
  if (p0 === "ressources") return renderRessources(sub);
  if (p0 === "connexion") return renderLogin(sub);
  if (p0 === "moi") return sub === "code" ? renderMyCode() : sub === "ressources" ? renderMyRes(n, force) : renderMe(force);
  if (p0 === "p"){ location.replace(AUTH.student ? "#/moi" : "#/connexion/" + (CONFIG.PROMOS[sub] ? sub : "1")); return; }
  if (!p0 || !CONFIG.YEARS[p0]) return renderHome();
  const year = p0;
  // Matières à liste (espagnol, allemand…) : visibles seulement des étudiants inscrits sur la liste
  if (rosterOf(year)){
    const me = AUTH.student;
    if (!me || me.promo !== promoOf(year)){ location.replace(me ? "#/moi" : "#/connexion/" + promoOf(year)); return; }
    if (!inRoster(year, me.name)){ toast(CONFIG.YEARS[year].subjectLabel + " : matière réservée aux étudiants de sa liste."); location.replace("#/moi"); return; }
  }
  setAccent(year);
  const view = $("#view");
  const paint = () => (sub === "k" && n) ? renderQuinzaine(year, Number(n)) : renderList(year);
  const here = location.hash;
  loadPromo(promoOf(year));
  if (state.bookings[year]){
    paint();
    if (force || !state.loaded[year] || Date.now() - state.loaded[year] >= 15000){
      syncing(true);
      loadBookings(year, true).then(() => { if (location.hash === here && !$("#sheet").classList.contains("open")) paint(); })
        .catch(() => { if (force) toast("Connexion impossible. Réessayez."); }).finally(() => syncing(false));
    }
  } else {
    view.innerHTML = '<div class="loading"><span class="spin"></span>Chargement…</div>';
    try { await loadBookings(year, force); }
    catch(e){
      setBar({ title: CONFIG.YEARS[year].subjectLabel, sub: CONFIG.YEARS[year].label, back: true, refresh: true });
      view.innerHTML = errBox("Impossible de joindre le serveur des inscriptions. Vérifiez votre connexion puis actualisez.");
      return;
    }
    if (location.hash !== here) return;
    paint();
  }
  let tick = 0;
  state.poll = setInterval(async () => {
    tick++;
    if (document.hidden || $("#sheet").classList.contains("open")) return;
    if (!windowKholles(year).length && tick % 3) return;
    try { await loadBookings(year, true); if (location.hash === here) paint(); } catch(e){}
  }, 10000);
}

function countdown(s, now = new Date()){
  const d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()), d1 = new Date(s.date.getFullYear(), s.date.getMonth(), s.date.getDate());
  const days = Math.round((d1 - d0) / 86400000);
  if (s.startsAt <= now) return "En cours";
  if (days === 0) return "Aujourd'hui à " + fmtTime(s.start);
  if (days === 1) return "Demain à " + fmtTime(s.start);
  return "Dans " + days + " jours";
}

        </a>
      </div>
      ${alertsCardHTML()}
      ${footHTML(`<a class="linkbtn" href="#/moi/code">${ICON.key} Changer mon code</a><button class="linkbtn" id="logout" type="button" style="border:0;background:none;cursor:pointer">${ICON.out} Se déconnecter de ce téléphone</button><br>`)}`;
    const ac = $("#alertsCard"); if (ac) ac.onclick = openAlerts;
    bindFullPlan(paint);
    $("#logout").onclick = () => studentLogout("Déconnecté.");
    paintResBadge();
    loadMyDocs().then(paintResBadge).catch(() => {});
  };

  syncing(false);

}

function renderMyCode(){

/* ---------- Bandeau des séances annulées ---------- */
function upcomingCancels(years, n){
  const today = iso(new Date());
  return (Array.isArray(years) ? years : years ? [years] : Object.keys(CONFIG.YEARS)).flatMap(y => Object.values(state.cancels[y] || {}).map(c => Object.assign({ year: y }, c)))
    .filter(c => String(c.date) >= today && (n == null || Number(c.q) === Number(n)) && CONFIG.YEARS[c.year])
    .sort((a, b) => String(a.date).localeCompare(String(b.date)));
}
function cancelBanner(years, n){
  const list = upcomingCancels(years, n);
  if (!list.length) return "";
  const multi = Array.isArray(years);
  const item = (c) => {
    const label = `${multi ? esc(CONFIG.YEARS[c.year].subjectLabel) + " · " : ""}Khôlle ${esc(c.q)} · <b>${esc(fmtDay(parseISO(String(c.date))))}</b> · ${esc(exName(c.year, c.examiner))} (${esc(c.room)})`;
    const why = c.reason ? `<span class="why">Motif : ${esc(c.reason)}</span>` : "";
    return n != null ? `<li>${label}${why}</li>` : `<li><a href="#/${c.year}/k/${esc(c.q)}">${label}</a>${why}</li>`;
  };
  return `<div class="alert cancel" role="alert">${ICON.warn}<span><b>${list.length > 1 ? "Séances de khôlle annulées" : "Séance de khôlle annulée"}</b>
    <ul class="clist">${list.map(item).join("")}</ul>
    ${n != null ? "Les inscriptions de ces séances ont été libérées : choisissez un autre créneau de la khôlle." : ""}</span></div>`;
}

/* ---------- Page d'une matière : liste des khôlles ---------- */
function statusPill(slots, now){
  if (slots.length && slots.every(s => slotStatus(s, now) === "cancelled")) return '<span class="pill cancel">Annulée</span>';
  slots = slots.filter(s => slotStatus(s, now) !== "cancelled");
  if (slots.every(s => slotStatus(s, now) === "past")) return '<span class="pill done">Terminée</span>';
  const open = slots.filter(s => slotStatus(s, now) === "open");
  const notyet = slots.filter(s => slotStatus(s, now) === "notyet");
  if (!open.length && notyet.length) return `<span class="pill soon">${openShort(notyet[0])}</span>`;
  const free = open.reduce((n, s) => n + freeSeats(s), 0);
  return free ? `<span class="pill free">${plural(free, "# place libre", "# places libres")}</span>` : '<span class="pill full">Complet</span>';
}
const khollePast = (q, now) => q.days.every(x => dayFrozen(x.date, now));

function renderList(year){
  const Y = CONFIG.YEARS[year], now = new Date(), me = AUTH.student;
  setBar({ title: Y.subjectLabel, sub: Y.label, back: true, refresh: true });
  if (Y.subject === "anglais") state.resFrom = year;
  const qs = khollesFor(year);
  const past = qs.filter(q => khollePast(q, now)), next = qs.filter(q => !khollePast(q, now));
  const curN = next.length ? next[0].n : null;
  const card = (q) => {
    const cur = q.n === curN, isPast = khollePast(q, now);
    const mine = me && q.slots.some(s => takers(s).some(b => b.student === me.name));
    return `<a class="qcard${cur ? " current" : ""}${isPast ? " past" : ""}" href="#/${year}/k/${q.n}">
      <span class="qnum">${q.n}</span>
      <span class="qbody"><span class="qt">Khôlle ${q.n}</span><br><span class="qd">${fmtDates(q.days.map(x => x.date))}</span>
      <span class="qpills">${cur ? '<span class="pill now">En cours</span>' : ""}${mine ? `<span class="pill mine">${acc("Inscrit", me.gender)}</span>` : ""}${statusPill(q.slots, now)}${!isPast && upcomingCancels(year, q.n).length ? '<span class="pill cancel">Séance annulée</span>' : ""}</span></span>
      ${ICON.chev}
    </a>`;
  };
  const withBands = (arr) => arr.map((q, i) => (i ? bandHTML(closedBetween(iso(arr[i - 1].days[arr[i - 1].days.length - 1].date), iso(q.days[0].date), true)) : "") + card(q)).join("");
  const own = !me || me.promo === Y.promo;
  $("#view").innerHTML = heroHTML(esc(Y.subjectLabel) + " " + esc(subjEmoji(Y.subject)), "Prépa ECT – " + esc(Y.label)) + cancelBanner(year) +
    (me ? "" : `<div class="alert info">${ICON.info}<span>Pour réserver, <a href="#/connexion/${esc(Y.promo)}">connectez-vous à votre espace</a>.</span></div>`) +
    (own ? "" : `<div class="alert warn">${ICON.warn}<span>Ce planning n'est pas celui de votre classe : consultation seule.</span></div>`) +
    (past.length ? `<button class="toggle" id="togglePast">${state.showPast ? "Masquer les khôlles terminées" : "Afficher les khôlles terminées (" + past.length + ")"}</button>` : "") +
    (state.showPast && past.length ? `<p class="kicker">Terminées · consultation seule</p><div class="list">${past.map(card).join("")}</div><div style="height:18px"></div>` : "") +
    `<p class="kicker">Khôlles à venir</p>` +
    (next.length ? `<div class="list">${withBands(next)}</div>` : '<div class="empty">Aucune khôlle à venir.</div>') +
    (me ? alertsCardHTML() : "") + footHTML();
  const t = $("#togglePast"); if (t) t.onclick = () => { state.showPast = !state.showPast; renderList(year); };
  const ac = $("#alertsCard"); if (ac) ac.onclick = openAlerts;
}

/* ---------- Une khôlle : les créneaux ---------- */
// Remplissage d'un créneau à plusieurs places : vert = tout libre, orange = en partie rempli, rouge = complet
const fillCls = (s) => { const n = takers(s).length; return n >= s.cap ? "f-full" : n ? "f-part" : "f-empty"; };
function seatsBar(s, mineName){
  const t = takers(s);
  return `<span class="seats" aria-hidden="true">${Array.from({ length: s.cap }, (_, i) => `<i class="${i < t.length ? (t[i].student === mineName ? "me" : "on") : ""}"></i>`).join("")}</span>`;
}
function slotRow(s, now, viewer){
  const t = takers(s), st = slotStatus(s, now), locked = st !== "open";
  const mine = viewer && t.some(b => b.student === viewer);
  const free = freeSeats(s);
  let txt, cls = locked ? "locked " : "";
  if (st === "cancelled"){ txt = "Annulé"; cls += "cancelled"; }
  else if (mine){ const g = (AUTH.student || {}).gender; txt = s.cap > 1 ? acc("Inscrit", g) + (free ? " · " + plural(free, "# place libre", "# places libres") : " · complet") : "Vous"; cls += "mine"; }
  else if (s.cap === 1){ txt = t.length ? esc(t[0].student) : st === "past" ? "—" : st === "notyet" ? openShort(s) : "Libre"; cls += t.length ? "taken" : "free"; }
  else { txt = !free ? "Complet" : st === "notyet" ? openShort(s) : st === "past" ? "—" : plural(free, "# place libre", "# places libres") + ` sur ${s.cap}`; cls += free ? "free" : "taken"; }
  const names = s.cap > 1 && t.length ? `<span class="snames">${t.map(b => esc(b.student === viewer ? "Vous" : b.student)).join(" · ")}</span>` : "";
  return `<button class="slot ${cls}${s.cap > 1 ? " multi" : ""}" data-id="${esc(s.id)}"><span class="time">${s.label}</span><span class="state">${s.cap > 1 ? seatsBar(s, viewer) : ""}<span>${txt}</span>${locked ? ICON.lock : s.cap > 1 && fillCls(s) === "f-full" ? '<span class="dot f-full" aria-hidden="true"></span>' : `<span class="dot${s.cap > 1 ? " " + fillCls(s) : ""}" aria-hidden="true"></span>`}</span>${names}</button>`;
}
function renderQuinzaine(year, n){
  const Y = CONFIG.YEARS[year], now = new Date(), me = AUTH.student;
  const q = khollesFor(year).find(x => x.n === n);
  if (!q){ setBar({ title: "Khôlle " + n, back: true }); $("#view").innerHTML = '<div class="empty">Pas de khôlle pour ce numéro.</div>'; return; }
  const first = q.days[0].date, last = q.days[q.days.length-1].date;
  setBar({ title: "Khôlle " + n, sub: Y.subjectLabel + " · " + Y.short + " · " + (iso(first) === iso(last) ? fmtShort(first) : fmtShort(first) + " – " + fmtShort(last)), back: true, refresh: true });
  const viewer = me && me.promo === Y.promo ? me.name : null;
  const multi = q.slots.some(s => s.cap > 1);
  let html = cancelBanner(year, n) + (viewer ? swapBanner(me, [year]) : "");
  if (viewer){ const ms = mySwap(year, n, viewer); if (ms) html += `<div class="alert swapc">${ICON.swap}<span>Votre demande d'échange est en cours (${plural(ms.wants.length, "# créneau proposé", "# créneaux proposés")}).</span></div>`; }
  if (viewer){
    const due = toBookFor(year, viewer, now, true);
    if (due && due.n === n) html += SKIP.has(viewer, year, n)
      ? `<div class="alert info skipbar">${ICON.info}<span>Rappel « À réserver » masqué pour cette khôlle. <button class="linkbtn" id="skipOff" type="button">Réactiver le rappel</button></span></div>`
      : `<div class="alert warn skipbar">${ICON.warn}<span><b>Vous n'êtes pas encore inscrit(e) à cette khôlle.</b> Choisissez un créneau ci-dessous.<br><button class="btn outline sm" id="skipOn" type="button">Je n'ai pas besoin de m'inscrire à cette khôlle</button></span></div>`;
  }
  if (multi){
    const tot = q.slots.filter(s => slotStatus(s, now) !== "cancelled").reduce((a, s) => a + s.cap, 0), used = q.slots.filter(s => slotStatus(s, now) !== "cancelled").reduce((a, s) => a + takers(s).length, 0);
    html += `<div class="fillcard"><div class="fc-top"><span>Places restantes</span><b>${tot - used} sur ${tot}</b></div><div class="fc-bar"><i style="width:${tot ? Math.round(used / tot * 100) : 0}%"></i></div></div>`;
  }
  html += khollePast(q, now)
    ? `<div class="alert info">${ICON.lock}<span><b>Khôlle terminée.</b> Le planning est figé : consultation uniquement.</span></div>`
    : `<div class="rule">${ICON.info}<span><b>Une seule inscription par étudiant</b> pour la Khôlle ${n}${q.days.length > 1 ? `, sur l'une des ${q.days.length} dates ci-dessous` : ""}. Les réservations de toute la khôlle ${openRuleText(year)}.</span></div>`;
  q.days.forEach((day, i) => {
    if (i) html += bandHTML(closedBetween(iso(q.days[i - 1].date), iso(day.date)));
    html += `<div class="weekhead"><h3>${fmtDay(day.date)}</h3>${statusPill(day.slots, now)}</div>`;
    const groups = {};
    day.slots.forEach(s => { (groups[s.examiner + "|" + s.room] ||= []).push(s); });
    Object.entries(groups).forEach(([g, list]) => {
      const [ex, room] = g.split("|"), cx = cancelOf(list[0]);
      html += `<div class="group${cx ? " cancelled" : ""}"><div class="ghead"><span class="who">${esc(exName(year, ex))}</span>${cx ? '<span class="cbadge">Annulée</span>' : topicHTML(year, list[0].sid)}<span class="room">${esc(room)}</span></div>`;
      if (cx) html += `<div class="cnote">Séance annulée par l'enseignant${cx.reason ? " · " + esc(cx.reason) : ""}.</div>`;
      list.forEach(s => { html += slotRow(s, now, viewer); });
      html += `</div>`;
    });
  });
  $("#view").innerHTML = html + footHTML();
  bindSwapButtons();
  const sOn = $("#skipOn"), sOff = $("#skipOff");
  if (sOn) sOn.onclick = () => { SKIP.set(viewer, year, n, true); toast("Rappel masqué pour la Khôlle " + n + "."); renderQuinzaine(year, n); };
  if (sOff) sOff.onclick = () => { SKIP.set(viewer, year, n, false); toast("Rappel réactivé."); renderQuinzaine(year, n); };
  $$(".slot").forEach(el => el.addEventListener("click", () => {
    const s = SLOT_INDEX[el.dataset.id]; if (!s) return;
    const st = slotStatus(s), t = takers(s);
    if (viewer && t.some(b => b.student === viewer)) return openMine(s);
    if (st === "cancelled") return toast("Séance annulée par l'enseignant.");
    if (st === "past") return toast("Créneau passé : consultation uniquement.");
    if (st === "notyet") return toast(inWindow(s) ? "Ouverture imminente : entre " + hourWin(s.openHour ?? CONFIG.OPEN_FROM_HOUR) + " aujourd'hui. Restez sur la page." : "Réservations ouvertes le " + openLabel(s) + ".");
    if (!freeSeats(s)){
      const own = viewer && allBookings(year).find(b => Number(b.q) === s.q && b.student === viewer), os = own && SLOT_INDEX[own.slotId];
      const inc = viewer && swapsForMe(me, [year]).find(x => x.slotId === s.id);
      if (inc) return openSwapAccept(inc);
      if (os && !tooLateFor(os) && !tooLateFor(s)) return openSwapRequest(os, [s.id]);
      return toast(s.cap > 1 ? "Créneau complet." : "Créneau déjà réservé par " + t[0].student + ".");
    }
    if (!me) return askLogin(Y.promo);
    if (me.promo === Y.promo && !inRoster(year, me.name)) return toast("Cette matière est réservée aux étudiants de sa liste.");
    if (s.only && !s.only.includes(me.name)) return toast("Ce créneau est réservé à un groupe fixe d'étudiants.");
    if (me.promo !== Y.promo) return toast("Ce planning n'est pas celui de votre classe.");
    openBook(s);
  }));

        "title": "Colin Gray guilty of murder in landmark Georgia school shooting trial",
        "source": "N'Dea Yancy-Bragg, USA Today",
        "date": "3 March 2026",
        "theme": "Parental responsibility and gun violence in the United States",

        "text": "A father whose son is accused of fatally shooting ⟦num|two teachers and two classmates⟧ at a ⟦prop|Georgia⟧ high school in ⟦num|2024⟧ was ⟦be|found guilty⟧ of ⟦be|murder⟧, ⟦be|manslaughter⟧ and other ⟦be|charges⟧ he faced ⟦conn|after⟧ providing his son the gun allegedly used in the shooting.\n\nThe ⟦be|jury⟧ ⟦be|convicted⟧ ⟦prop|Colin Gray⟧, ⟦num|55⟧, on ⟦num|27 counts⟧, ⟦conn|including⟧ ⟦be|second-degree murder⟧, ⟦be|involuntary manslaughter⟧, ⟦be|reckless conduct⟧ and ⟦be|cruelty to children⟧ ⟦conn|after⟧ ⟦num|less than two hours⟧ of ⟦be|deliberations⟧. ⟦num|Two charges⟧ of ⟦be|cruelty to children⟧ in the second-degree were ⟦be|dismissed⟧ before the ⟦be|jury⟧ deliberated.\n\nThe most serious charge, ⟦be|second-degree murder⟧ is ⟦be|punishable⟧ by ⟦num|up to 30 years⟧ in ⟦be|prison⟧ in ⟦prop|Georgia⟧, less than ⟦be|murder⟧ ⟦conn|but⟧ more than ⟦be|involuntary manslaughter⟧. ⟦prop|Colin Gray⟧ appeared to show little emotion as the ⟦be|verdict⟧ was read.\n\n⟦prop|Mason Schermerhorn⟧ and ⟦prop|Christian Angulo⟧, ⟦num|both 14⟧, and teachers ⟦prop|Richard Aspinwall⟧ and ⟦prop|Christina Irimie⟧ were killed in the shooting at ⟦prop|Apalachee High School⟧, which sent shock waves through the tight-knit, rural community. ⟦prop|Colin Gray⟧ ⟦be|testified⟧ during the roughly ⟦num|two-week-long⟧ ⟦be|trial⟧ that he gave his son, ⟦prop|Colt Gray⟧, the rifle as a ⟦prop|Christmas⟧ present. ⟦be|Prosecutors⟧ say that same rifle was ⟦conn|later⟧ used in the attack.\n\n⟦be|Prosecutors⟧ argued that ⟦prop|Colin Gray⟧ should have known the danger his son posed. The case was \"about who armed ⟦prop|Colt⟧ and who enabled him to do what he did,\" ⟦be|prosecutor⟧ ⟦prop|Patricia Brooks⟧ told ⟦be|jurors⟧ in her ⟦be|closing arguments⟧. ⟦prop|Colin Gray⟧ ⟦be|testified⟧ in his own ⟦be|defense⟧ that he had no idea his son was capable of carrying out a mass shooting. \"I struggle with it ⟦num|every day⟧,\" he said during the emotional testimony.\n\nThe ⟦be|charges⟧ marked the ⟦num|fi         "text": "I watched ⟦prop|Nye⟧, the ⟦prop|National Theatre’s⟧ hit show about ⟦prop|Aneurin Bevan⟧, the former ⟦prop|Labour⟧ ⟦prop|MP⟧ for ⟦prop|Ebbw Vale⟧ and his fight to found a ⟦be|national health service⟧, ⟦num|twice⟧. ⟦num|Both times⟧ it left me feeling a bit queasy. ⟦prop|Bevan⟧ is a mighty ⟦be|working-class hero⟧. Probably no other ⟦be|minister⟧, ⟦conn|even⟧ in that ⟦num|1945⟧ ⟦be|government⟧ of heroes, would have had the vision, the muscle or the sheer energy to make a ⟦be|national health service⟧ happen at all in those bleak ⟦num|postwar years⟧, ⟦conn|let alone⟧ in a way that no incoming ⟦be|government⟧ could unpick.\n\n⟦prop|The NHS⟧ sits at the heart of ⟦be|politics⟧ and for most of my ⟦be|career in journalism⟧, and charting the ⟦be|crises⟧, the numbers, the arguments, the possibilities and the ⟦be|costs⟧ was a staple of my work. You can write all that, you can read about all that, ⟦conn|but⟧ it can feel very different ⟦conn|when⟧ events dictate that you cross the line from ⟦be|commentator⟧ to ⟦be|patient⟧; ⟦conn|when⟧, ⟦conn|like me⟧, you pitch up as someone who arrives as an ⟦be|emergency⟧, with a condition that might require ⟦be|major surgery⟧ and ⟦num|at least a week⟧ of ⟦be|post-operative hospital care⟧ – or might just go away of its own accord.\n\nThere are other places in the world, I suppose, where you crawl into the ⟦be|emergency department⟧ wanting to die and are met with warmth and sympathy, ⟦be|competent professionals⟧ in more or less functional surroundings. It’s not, or not just, the security of not having to worry about ⟦be|the bill⟧, ⟦conn|because⟧ there are other ways of ⟦be|funding healthcare⟧ that are ⟦be|free at the point of use⟧. I won’t pretend mine is a unique experience, or that all experiences are like mine, ⟦conn|but⟧ proximity is important: having had the time to watch a ⟦be|ward⟧ at work, I feel there is alchemy in play here, and ⟦conn|after⟧ ⟦num|six days⟧ with nothing to do ⟦conn|but⟧ lie relatively flat and ponder, I think I may have identified it.\n\n⟦conn|At its heart⟧ is the sense of a shared destination. It’s like getting on a bus, maybe not the sleekest model and definitely overloaded, ⟦conn|but⟧ we’re all on the journey together. Everyone who’s seriously and unexpectedly ill comes here. Everyone. You don’t lie in your narrow ⟦be|hospital bed⟧ imagining the ⟦be|four-star facilities⟧ you might be enjoying if only you had more ⟦be|dosh⟧, ⟦conn|because⟧ it’s odds on that if it’s an ⟦be|emergency⟧, that person too is just behind the curtain hanging limply to your right.\n\n⟦conn|So⟧ there’s a ⟦be|common purpose⟧ among us all, and we all want to get to the other end. You don’t really want to die, at least not without some ⟦be|pain relief⟧ first, and they don’t want you to die ⟦conn|either⟧ and are doing their damnedest to help. ⟦conn|Somehow⟧ you know that ⟦conn|even as⟧ you wait, cold with shock and in miserable pain, that you are seen. And counted.\n\n(…)",

|However⟧, some children's and ⟦be|online safety organisations⟧ say a ⟦be|blanket ban⟧ is not the right way forward. A ⟦be|joint statement⟧, signed by ⟦num|43⟧ ⟦be|child protection charities⟧ and ⟦be|online safety groups⟧, ⟦conn|including⟧ the ⟦prop|NSPCC⟧ and the ⟦prop|Molly Rose Foundation⟧, ⟦conn|alongside⟧ academics and bereaved families, warned of serious ⟦be|unintended consequences⟧ that could put children at greater risk.\n\nThey wrote: \"⟦conn|Though⟧ well-intentioned, blanket bans on ⟦be|social media⟧ would fail to deliver the improvement in children's safety and wellbeing that they so urgently need. They are a blunt response that fails to address the successive shortcomings of ⟦be|tech companies⟧ and governments to act decisively and sooner.\"\n\n⟦prop|Andy Burrows⟧, ⟦be|chief executive⟧ of the ⟦prop|Molly Rose Foundation⟧, told ⟦prop|Sky News⟧: \"We're really concerned that parents and parliamentarians are being presented with a ⟦be|false binary⟧ right now, the idea that ⟦conn|either⟧ we proceed with an outright ban ⟦conn|and or⟧ we continue with the appalling ⟦be|status quo⟧ in which children are coming to harm. Those simply aren't the only options available to us\". ⟦prop|Mr. Burrows⟧ said: \"What we've seen is an ⟦be|online safety act⟧ that was ⟦be|watered down⟧ ⟦conn|because of⟧ the political chaos over ⟦num|the last few years⟧. It is not strong enough. It is not being ⟦be|enforced⟧ robustly enough.\n\n⟦conn|In another statement⟧, ⟦prop|Chris Sherwood⟧, ⟦be|chief executive⟧ of the ⟦prop|NSPCC⟧, highlighted the \"countless children\" for whom the internet is \"a ⟦be|lifeline⟧,\" describing it as \"a source of community, identity, and vital support\". He said: \"A ⟦be|blanket ban⟧ would take those spaces away ⟦num|overnight⟧ and risks driving teenagers into darker, ⟦be|unregulated⟧ corners of the internet.\"",

        "title": "Why people say they care about ethical shopping but often buy differently",

        "standfirst": "",
        "text": "Many ⟦prop|Canadians⟧ say they care about ⟦be|ethical products⟧. (…) Many also say they are willing to pay more for ⟦be|ethically produced goods⟧. ⟦conn|Yet⟧ those values often fade once people are standing in front of a ⟦be|shelf⟧ of seemingly identical products. This gap between what ⟦be|consumers⟧ say they value and what they actually buy is often described as hypocrisy. That explanation is tempting, ⟦conn|but⟧ it misses something important. In most ⟦be|shopping⟧ situations, people are not choosing between right and wrong — they are choosing between ⟦be|prices⟧.\n\nThat tension has become harder to ignore as ⟦be|food prices⟧ in ⟦prop|Canada⟧ have risen sharply, ⟦be|squeezing household budgets⟧ (…). ⟦num|At the same time⟧, ⟦prop|Canadians⟧ continue to express concern for ⟦be|sustainability⟧ and ⟦be|ethical production⟧. Caring has not disappeared. Acting on it simply feels harder now.\n\n⟦be|Consumer research⟧ has long documented a gap between ⟦be|stated preferences⟧ and actual behaviour. In ⟦be|surveys⟧, people tend to express stronger ethical intentions than they act on in real ⟦be|shopping⟧ situations. That does not mean those values are insincere, ⟦conn|but⟧ that values are pushed aside when everyday constraints take over. This gap shows up most clearly in ⟦be|routine purchases⟧ like groceries, coffee and chocolate. These are items people buy often, and ⟦conn|even⟧ small ⟦be|price differences⟧ add up quickly. In those moments, price becomes the easiest ⟦be|decision shortcut⟧, ⟦conn|especially as⟧ ⟦be|food costs⟧ continue to rise in ⟦prop|Canada⟧.\n\nEthical products usually cost more ⟦conn|because⟧ they support ⟦be|higher wages⟧, safer ⟦be|working conditions⟧ and lower ⟦be|environmental harm⟧. (…) Ethical products are often framed as “⟦be|premium⟧” goods, with higher ⟦be|prices⟧ justified by their social or environmental benefits.\n\nIn our recent ⟦be|research study⟧, we asked whether the ⟦be|ethical premium⟧ always had to be paid in money. ⟦conn|Instead of⟧ focusing on higher ⟦be|prices⟧, we examined whether ⟦be|consumers⟧ would respond differently if ⟦be|ethical products⟧ were offered at ⟦num|the same price⟧ as ⟦be|conventional⟧ ones, ⟦conn|but⟧ in ⟦num|smaller quantities⟧. ⟦conn|To explore this⟧, we ran a series of ⟦be|experiments⟧ with more than ⟦num|2,300⟧ ⟦be|participants⟧ in ⟦prop|Canada⟧, ⟦prop|the United States⟧ and ⟦prop|Europe⟧. Participants were asked to choose between ethical options (…) and ⟦be|conventional⟧ alternatives for everyday products like coffee and soap. Participants were then randomly assigned to conditions that framed the ⟦be|ethical premium⟧ ⟦conn|either⟧ through price or ⟦be|quantity⟧. (…) ⟦conn|Across our experiments⟧, ⟦be|consumers⟧ were consistently more likely to choose ⟦be|ethical products⟧ when the ⟦be|premium⟧ was framed as giving up ⟦be|quantity⟧ ⟦conn|rather than⟧ paying a higher price. ⟦conn|Across our experiments⟧, people reacted more strongly to ⟦be|price increases⟧ than to size changes. Consumers are more sensitive to price information than ⟦be|quantity⟧ information.\n\n⟦conn|When⟧ ⟦be|ethical products⟧ cost the same as ⟦be|conventional⟧ ones, ⟦be|consumers⟧ no longer feel ⟦be|financially penalized⟧ for acting on their values. ⟦conn|Rather⟧, paying the ⟦be|premium⟧ with ⟦be|quantity⟧ makes the ethical product feels more ⟦be|affordable⟧. ⟦conn|Importantly⟧, this approach is not the same as ⟦be|shrinkflation⟧ (…). In our studies, the smaller size was explicitly visible, and ⟦be|consumers⟧ knew exactly what they were choosing.\n\n(…) Rethinking how the ⟦be|ethical premium⟧ is paid will not solve the problem overnight. Structural issues, ⟦conn|such as⟧ ⟦be|supply chains⟧, ⟦be|corporate practices⟧ and ⟦be|regulation⟧, still matter deeply. ⟦conn|But⟧ our findings suggest that ⟦be|design choices⟧ and ⟦be|pricing strategies⟧ can make a meaningful difference in whether ⟦be|consumers⟧ are able to act on their values. (…)",
        "b2n": 153,

        "comment": "Problématique : Can consumers really change the world through their purchases, or does responsibility lie elsewhere?\n## I. The rise of conscious consumption\n- Drivers: climate awareness, scandals (Rana Plaza, Bangladesh, 2013), social media, younger generations\n- Tools: labels (Fairtrade, organic, B Corp), boycotts, \"voting with your wallet\"\n- Trends: second-hand (Vinted), local, vegan, repair; firms' CSR policies; France's loi PACTE (2019, \"entreprise à mission\")\n## II. Why intentions do not turn into action\n- Purchasing power: inflation, ethical premium, time and information costs\n- Greenwashing and label proliferation → distrust (Dieselgate, 2015)\n- Behavioural economics: cognitive dissonance, moral licensing, social norms, nudges (Thaler)\n- Paradox of fast fashion (Shein, Temu): massive success despite criticism\n## III. Who should act?\n- Individual vs. collective responsibility: the \"carbon footprint\" concept popularised by BP\n- Regulation: French duty of vigilance law (2017), EU due-diligence directive, repairability index, bans on destroying unsold goods\n- Transparency and information: Nutri-Score, eco-score; business-model innovation (circular economy)\n## Conclusion et ouverture\n- Consumers matter but cannot carry the whole burden: ethical choices must become the easy choices\n- Opening: is \"ethical consumption\" a contradiction in a growth-based consumer society (degrowth, sufficiency)?",
