function richText(src){
  const blocks = String(src).trim().split(/\n\s*\n/);
  return blocks.map(b => {
    const lines = b.split("\n").map(l => l.trim()).filter(Boolean);
    let out = "", list = [];
    const flush = () => { if (list.length){ out += "<ul>" + list.map(li => `<li>${esc(li)}</li>`).join("") + "</ul>"; list = []; } };
    lines.forEach(l => {
      if (/^[-•–]\s+/.test(l)) list.push(l.replace(/^[-•–]\s+/, ""));
      else if (/^##\s+/.test(l)){ flush(); out += `<h4>${esc(l.replace(/^##\s+/, ""))}</h4>`; }
      else if (/^>\s+/.test(l)){ flush(); out += `<p class="note">${esc(l.replace(/^>\s+/, ""))}</p>`; }
      else if (/^Problématique\s*:/.test(l)){ flush(); out += `<p class="pb"><b>Problématique :</b> ${esc(l.replace(/^Problématique\s*:\s*/, ""))}</p>`; }
      else { flush(); out += `<p>${hlTags(esc(l))}</p>`; }
    });
    flush(); return out;
  }).join("");
}
function videoEmbed(code){
  code = String(code || "").trim(); if (!code) return "";
  let src = (code.match(/src\s*=\s*["']([^"']+)["']/i) || [])[1] || code;
  src = src.replace(/&amp;/g, "&").trim();
  let m;
  if ((m = src.match(/(?:youtube\.com\/watch\?(?:.*&)?v=|youtu\.be\/|youtube\.com\/shorts\/|youtube\.com\/live\/)([\w-]{11})/))) src = "https://www.youtube-nocookie.com/embed/" + m[1];
  else if ((m = src.match(/^https:\/\/vimeo\.com\/(\d+)/))) src = "https://player.vimeo.com/video/" + m[1];
  if (!/^https:\/\//i.test(src)) return "";
  const w = +(code.match(/width\s*=\s*["']?(\d+)/i) || [])[1], h = +(code.match(/height\s*=\s*["']?(\d+)/i) || [])[1];
  const ratio = w && h ? `${w} / ${h}` : "16 / 9";
  return `<div class="vwrap" style="aspect-ratio:${ratio}"><iframe src="${esc(src)}" title="Vidéo" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>`;
}

      if (!f) return msg("Choisissez un fichier.");

      if (!title) return msg("Donnez un titre au document.");
      btn.disabled = true; btn.textContent = "Envoi en cours…";
      const qs = Object.entries(Object.assign({ action: "uploadDoc", name: f.name }, base)).map(([k, v]) => k + "=" + encodeURIComponent(v)).join("&");
      try {
        const res = await fetch(CONFIG.API_URL + "?" + qs, { method: "POST", body: f.slice(0, f.size, "") });

      } catch(e){ r = { ok: false, error: "Envoi impossible. Vérifiez votre connexion puis réessayez." }; }
    } else {
      const url = $("#dUrl").value.trim();
      if (!/^https:\/\/\S+\.\S+/.test(url)) return msg("Indiquez une adresse complète commençant par https://");
      if (!title) return msg("Donnez un titre au document.");

      try { r = await API.post(Object.assign({ action: "addDoc", url }, base)); } catch(e){ r = { ok: false, error: "Connexion impossible." }; }
    }
    if (r && r.auth){ closeSheet(); return teacherExpired(); }
    if (!r || !r.ok){ btn.disabled = false; btn.textContent = "Déposer"; return msg((r && r.error) || "Erreur."); }

/* Échanges de créneaux entre étudiants                                    */
/* ====================================================================== */
const swapsOf = (year) => (state.swaps && state.swaps[year]) || [];
const mySwap = (year, q, name) => swapsOf(year).find(x => Number(x.q) === Number(q) && x.student === name) || null;
// Demandes reçues : un camarade propose son créneau contre le mien
function swapsForMe(me, years){
  return (years || promoYears(me.promo)).flatMap(y => {
    const mine = allBookings(y).filter(b => b.student === me.name);
    return swapsOf(y).filter(x => x.student !== me.name).map(x => {
      const b = mine.find(m => Number(m.q) === Number(x.q));
      const a = SLOT_INDEX[x.slotId], s = b && SLOT_INDEX[b.slotId];
      return b && a && s && x.wants.includes(b.slotId) && !tooLateFor(a) && !tooLateFor(s) ? Object.assign({}, x, { from: a, to: s }) : null;
    }).filter(Boolean);
  });
}
const swapLine = (x, withSubj) => `${withSubj ? esc(CONFIG.YEARS[x.year].subjectLabel) + " · " : ""}Khôlle ${esc(x.q)} : <b>${esc(x.student)}</b> propose son créneau du <b>${esc(describeSlot(x.slotId))}</b> contre le vôtre (${esc(x.to.label)}).`;
function swapBanner(me, years, withLinks){
  const list = swapsForMe(me, years);
  if (!list.length) return "";
  return `<div class="alert swapc">${ICON.swap}<span><b>${list.length > 1 ? "Demandes d'échange" : "Demande d'échange"}</b>
    <ul class="clist">${list.map(x => withLinks ? `<li><a href="#/${x.year}/k/${x.q}">${swapLine(x, true)}</a></li>` : `<li>${swapLine(x, false)} <button class="sbtn swapbtn" data-swap="${x.id}" type="button">Répondre</button></li>`).join("")}</ul></span></div>`;
}
async function swapCall(btn, busy, payload, okMsg){
  const me = AUTH.student, label = btn.textContent;
  btn.disabled = true; btn.textContent = busy;
  let r;
  try { r = await API.post(Object.assign({ token: me.token, app: APP_URL }, payload)); } catch(e){ r = { ok: false, error: "Connexion impossible (" + e.message + "). Réessayez." }; }
  if (r.auth){ closeSheet(); return studentLogout(r.error); }
  if (Array.isArray(r.bookings)) applyState(payload.year, r);
  if (r.ok){ closeSheet(); toast(okMsg); }
  else { $("#msg").innerHTML = errBox(esc(r.error || "Opération refusée.")); btn.disabled = false; btn.textContent = label; }
  draw();
}
// Proposer mon créneau à l'échange : je coche les créneaux qui me conviendraient
function openSwapRequest(s, pre){
  const me = AUTH.student, q = khollesFor(s.year).find(k => k.n === s.q), cur = mySwap(s.year, s.q, me.name);
  const cands = q.slots.filter(o => o.id !== s.id && slotStatus(o) !== "cancelled" && slotStatus(o) !== "past" && !tooLateFor(o) && takers(o).some(b => b.student !== me.name));
  const checked = (o) => pre ? pre.includes(o.id) : cur ? cur.wants.includes(o.id) : true;
  openSheet(`
    <h4 id="sheetTitle">${ICON.swap} Proposer un échange</h4>
    <p class="meta">Votre créneau : <b>${esc(describeSlot(s.id))}</b></p>
    ${cands.length ? `<p class="lbl" style="margin-top:4px">Créneaux qui vous conviendraient</p>
      <div class="swlist">${cands.map(o => `<label class="check"><input type="checkbox" value="${esc(o.id)}" ${checked(o) ? "checked" : ""}> <span><b>${esc(fmtDay(o.date))} · ${esc(o.label)}</b><br><small>${esc(exName(o.year, o.examiner))} · ${esc(o.room)} · ${esc(takers(o).map(b => b.student).join(", "))}</small></span></label>`).join("")}</div>
      <p class="hint">Les étudiants inscrits sur ces créneaux reçoivent votre demande. Le premier qui accepte prend votre place, et vous la sienne. Vous restez ${acc("inscrit", me.gender)} sur votre créneau tant que personne n'a accepté.</p>`
      : `<div class="empty">Aucun autre créneau occupé dans cette khôlle.<br><small>Pour changer, touchez simplement un créneau libre.</small></div>`}
    <div class="msg" id="msg"></div>
    <div class="actions">${cands.length ? `<button class="btn primary" id="go">${cur ? "Mettre à jour la demande" : "Envoyer la demande"}</button>` : ""}<button class="btn ghost" id="close">Annuler</button></div>`);
  $("#close").onclick = closeSheet;

  if (go) go.onclick = () => {

    swapCall(go, "Envoi…", { action: "swapRequest", year: s.year, q: s.q, wants }, "Demande d'échange envoyée.");
  };
}
function openSwapAccept(x){
  openSheet(`

const gKey = (year, q, student) => year + "|" + q + "|" + student;
async function loadGrades(c, force){
  if (!force && state.grades && state.grades.subject === c.subject && Date.now() - state.grades.t < 30000) return state.grades;
  const r = await API.get({ action: "grades", token: c.token, subject: c.subject });
  if (r.auth){ teacherExpired(); return null; }
  if (!r.ok) throw new Error(r.error || "Erreur serveur");
  const map = {}; r.grades.forEach(g => map[gKey(g.year, g.q, g.student)] = g);
  state.grades = { subject: c.subject, t: Date.now(), map };
  return state.grades;
}
const fmtNote = (g) => !g ? "" : g.absent ? "Abs." : String(g.value).replace(".", ",");
const canGrade = (c, ex) => c.admin || c.isResp || ex === c.name;
// Séances passées de la matière, avec leurs inscrits (plus récentes d'abord)
function pastSessions(c){
  const now = Date.now(), map = {};
  subjectYears(c.subject).forEach(y => allBookings(y).forEach(b => {
    const s = SLOT_INDEX[b.slotId];
    if (!s || s.startsAt.getTime() > now || cancelOf(s)) return;
    const S = map[s.sid] || (map[s.sid] = { sid: s.sid, year: s.year, q: s.q, date: s.date, examiner: s.examiner, room: s.room, rows: [] });
    S.rows.push({ s, student: b.student });
  }));
  return Object.values(map).map(S => { S.rows.sort((a, b) => a.s.start - b.s.start); S.first = S.rows[0].s; S.last = S.rows[S.rows.length - 1].s; return S; })
    .sort((a, b) => b.first.startsAt - a.first.startsAt);
}
const sessDone = (S) => S.rows.filter(r => state.grades && state.grades.map[gKey(S.year, S.q, r.student)]).length;
function toGradeCount(c){
  if (!state.grades) return null;
  return pastSessions(c).filter(S => (c.name ? S.examiner === c.name : true) && sessDone(S) < S.rows.length).length;
}
async function loadSubjectBookings(c, force){
  await Promise.all(subjectYears(c.subject).map(y => loadBookings(y, force).catch(() => {})));
}

async function renderNotes(sid, force){
  const c = TCTX(), view = $("#view"), here = location.hash;
  setAccent(state.tYear || "1");
  if (c.admin) document.body.classList.add("admin-mode");
  if (!state.grades || state.grades.subject !== c.subject) view.innerHTML = '<div class="loading"><span class="spin"></span>Chargement…</div>';
  try { await Promise.all([loadSubjectBookings(c, force), loadGrades(c, force)]); }
  catch(e){ if (!state.grades){ setTeacherBar(c, "Notes"); view.innerHTML = errBox("Impossible de charger les notes. Vérifiez votre connexion puis actualisez."); return; } }
  if (location.hash !== here || !state.grades) return;
  if (sid) return renderNoteSession(c, decodeURIComponent(sid));
  setTeacherBar(c, "Notes");
  const tab = state.nTab || "saisie";
  let html = adminStrip(c) + `<div class="alert info">${ICON.lock}<span>Notes <b>confidentielles</b> : visibles des seuls enseignants de la matière, jamais des étudiants.</span></div>
    <div class="tabs" role="tablist"><button class="tab${tab === "saisie" ? " on" : ""}" data-t="saisie">Saisie</button><button class="tab${tab === "recap" ? " on" : ""}" data-t="recap">Récapitulatif</button></div>`;
  if (tab === "saisie"){
    const mineOnly = c.name && state.nMine !== false;
    const all = pastSessions(c), list = mineOnly ? all.filter(S => S.examiner === c.name) : all;
    if (c.name) html += `<div class="chips"><button class="chip${mineOnly ? " on" : ""}" data-m="1">Mes séances</button><button class="chip${mineOnly ? "" : " on"}" data-m="0">Toutes les séances</button></div>`;
    const todo = list.filter(S => sessDone(S) < S.rows.length), done = list.filter(S => sessDone(S) === S.rows.length);
    const row = (S) => { const n = sessDone(S), t = S.rows.length;
      return `<a class="prow" href="#/prof/notes/${encodeURIComponent(S.sid)}">
        <span class="pdate"><span>${JOURS[S.date.getDay()].slice(0, 3)}.</span><b>${S.date.getDate()}</b><span>${MOIS_C[S.date.getMonth()]}</span></span>
        <span class="pbody"><b>Khôlle ${S.q} · ${esc(CONFIG.YEARS[S.year].short)}</b><br><span>${esc(fmtTime(S.first.start))} – ${esc(fmtTime(S.last.start + S.last.dur))} · ${esc(S.examiner)} · ${esc(S.room)}</span></span>
        <span class="npill${n === t ? " ok" : ""}">${n === t ? ICON.check : n + "/" + t}</span></a>`; };
    html += todo.length ? `<p class="kicker" style="margin-top:6px">À noter · ${todo.length}</p><div class="plist">${todo.map(row).join("")}</div>`
      : `<div class="empty">${list.length ? "Toutes les séances sont notées." : "Aucune séance passée pour le moment."}</div>`;
    if (done.length) html += `<p class="kicker" style="margin-top:20px">Notées</p><div class="plist">${done.map(row).join("")}</div>`;
  } else {
    const years = subjectYears(c.subject), y = years.includes(state.nYear) ? state.nYear : years[0];
    html += yearTabs(years, y, "data-ny");
    if (y){
      const qs = khollesFor(y).filter(k => k.slots.some(s => s.startsAt <= new Date())).map(k => k.n);
      const names = promoStudents(CONFIG.YEARS[y].promo).filter(n => inRoster(y, n));
      const cell = (n, k) => { const g = state.grades.map[gKey(y, k, n)]; return `<td class="${g && g.absent ? "abs" : ""}">${fmtNote(g) || "·"}</td>`; };
      const avg = (n) => { const v = qs.map(k => state.grades.map[gKey(y, k, n)]).filter(g => g && !g.absent).map(g => g.value); return v.length ? (v.reduce((a, b) => a + b, 0) / v.length).toFixed(1).replace(".", ",") : "–"; };
      html += qs.length ? `<div class="gtable"><table><thead><tr><th>Étudiant</th>${qs.map(k => `<th>K${k}</th>`).join("")}<th>Moy.</th></tr></thead>
        <tbody>${names.map(n => `<tr><th>${esc(n)}</th>${qs.map(k => cell(n, k)).join("")}<td class="avg">${avg(n)}</td></tr>`).join("")}</tbody></table></div>
        <p class="hint">K = khôlle · Abs. = absent · moyenne calculée sans les absences.</p>` : `<div class="empty">Aucune khôlle passée pour cette classe.</div>`;
    }
    html += `<div class="group exports" style="margin-top:14px"><a class="xrow" href="${exportUrl("grades")}">${ICON.list}<span><b>Exporter les notes pour Excel</b><br><small>Une ligne par étudiant, une colonne par khôlle, moyenne</small></span></a></div>`;
  }
  view.innerHTML = html;
  bindAdminStrip();
  $$("[data-t]").forEach(b => b.onclick = () => { state.nTab = b.dataset.t; renderNotes(); });
  $$("[data-m]").forEach(b => b.onclick = () => { state.nMine = b.dataset.m === "1"; renderNotes(); });
  $$("[data-ny]").forEach(b => b.onclick = () => { state.nYear = b.dataset.ny; renderNotes(); });
}

function renderNoteSession(c, sid){
  const S = pastSessions(c).find(x => x.sid === sid);
  setTeacherBar(c, "Notes");
  if (!S){ $("#view").innerHTML = `<div class="empty">Séance introuvable.</div>`; return; }
  const edit = canGrade(c, S.examiner);
  $("#view").innerHTML = adminStrip(c) + `
    <div class="nhead"><b>${esc(CONFIG.YEARS[S.year].subjectLabel)} · Khôlle ${S.q} · ${esc(CONFIG.YEARS[S.year].short)}</b><br>${esc(fmtDay(S.date))} · ${esc(exName(S.year, S.examiner))} · salle ${esc(S.room)}</div>
    ${edit ? `<p class="hint" style="margin:0 4px 10px">Note sur 20, demi-points acceptés (13,5). Enregistrement automatique.</p>` : `<div class="alert info">${ICON.lock}<span>Consultation seule : séance de ${esc(S.examiner)}.</span></div>`}
    <div class="group ngroup">${S.rows.map((r, i) => { const g = state.grades.map[gKey(S.year, S.q, r.student)]; return `
      <div class="nrow" data-i="${i}">
        <span class="nwho"><small>${esc(r.s.label)}</small><b>${esc(r.student)}</b></span>
        <input class="ninput" type="text" inputmode="decimal" enterkeyhint="next" autocomplete="off" maxlength="4" aria-label="Note de ${esc(r.student)} sur 20"
          value="${g && !g.absent ? fmtNote(g) : ""}" ${g && g.absent ? 'placeholder="Abs." disabled' : 'placeholder="–"'} ${edit ? "" : "readonly"}>
        <span class="nsur">/20</span>
        ${edit ? `<button class="nabs${g && g.absent ? " on" : ""}" type="button" aria-pressed="${!!(g && g.absent)}">Abs.</button>` : ""}
        <span class="nstate">${g ? ICON.check : ""}</span>
      </div>`; }).join("")}</div>
    <div class="actions"><a class="btn outline" href="#/prof/notes">Terminé</a></div>`;
  bindAdminStrip();
  if (!edit) return;
  const rows = [...document.querySelectorAll(".nrow")];
  const save = async (row, body) => {
    const r0 = S.rows[Number(row.dataset.i)], st = row.querySelector(".nstate");
    st.innerHTML = '<span class="spin sm"></span>'; st.className = "nstate";
    let r; try { r = await tCall(Object.assign({ action: "setGrade", year: S.year, q: S.q, student: r0.student }, body)); } catch(e){ r = { ok: false, error: "Connexion impossible : réessayez." }; }
    if (r.auth) return teacherExpired();
    if (!r.ok){ st.innerHTML = ICON.warn; st.className = "nstate err"; toast(r.error || "Erreur."); return false; }
    const k = gKey(S.year, S.q, r0.student);
    if (r.grade) state.grades.map[k] = r.grade; else delete state.grades.map[k];
    st.innerHTML = r.grade ? ICON.check : ""; st.className = "nstate ok";
    return true;
  };
  rows.forEach((row, i) => {
    const inp = row.querySelector(".ninput"), abs = row.querySelector(".nabs");
    const commit = async () => {
      const v = inp.value.trim().replace(".", ","), g = state.grades.map[gKey(S.year, S.q, S.rows[i].student)];
      if (inp.disabled) return;
      if (!v){ if (g) await save(row, { clear: true }); return; }
      const n = Number(v.replace(",", "."));
      if (!(n >= 0 && n <= 20) || Math.round(n * 2) !== n * 2){ row.querySelector(".nstate").innerHTML = ICON.warn; row.querySelector(".nstate").className = "nstate err"; toast("Note de 0 à 20, demi-points acceptés (13,5)."); return; }
      inp.value = String(n).replace(".", ",");
      if (g && !g.absent && g.value === n) return;
      await save(row, { value: n });
    };
    inp.addEventListener("change", commit);
    inp.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); const nx = rows.slice(i + 1).map(r => r.querySelector(".ninput")).find(x => !x.disabled); nx ? nx.focus() : inp.blur(); } });
    abs.onclick = async () => {
      const on = !abs.classList.contains("on");
      if (await save(row, on ? { absent: true } : { clear: true }) === false) return;
      abs.classList.toggle("on", on); abs.setAttribute("aria-pressed", on);
      inp.disabled = on; inp.value = ""; inp.placeholder = on ? "Abs." : "–";
      if (!on) inp.focus();
    };
  });
  const firstEmpty = rows.map(r => r.querySelector(".ninput")).find(x => !x.disabled && !x.value);
  if (firstEmpty && !matchMedia("(pointer:coarse)").matches) firstEmpty.focus();
}

const PLAN_KEY = "khollapp-plan";
const planPref = () => { try { return JSON.parse(localStorage.getItem(PLAN_KEY) || "{}"); } catch(e){ return {}; } };
const setPlanPref = (o) => { try { localStorage.setItem(PLAN_KEY, JSON.stringify(Object.assign(planPref(), o))); } catch(e){} };
function planBySubject(me, years, now){
  return years.filter(y => inRoster(y, me.name)).sort((a, b) => CONFIG.YEARS[a].subjectLabel.localeCompare(CONFIG.YEARS[b].subjectLabel, "fr", { sensitivity: "base" })).map(y => {
    const Y = CONFIG.YEARS[y], m = subjectMeta(subjectOfYear(y));
    const qs = khollesFor(y).filter(q => !khollePast(q, now));
    const mine = allBookings(y).filter(b => b.student === me.name);
    const rows = qs.map(q => {
      const b = mine.find(x => Number(x.q) === q.n), s = b && SLOT_INDEX[b.slotId];
      const dates = esc(fmtDates(q.days.map(x => x.date)));
      if (s) return `<a class="pl-row ok" href="#/${y}/k/${q.n}"><span class="pl-k">K${q.n}</span><span class="pl-b"><b>${esc(fmtDay(s.date))} · ${esc(s.label)}</b><br><small>${esc(s.examiner)} · salle ${esc(s.room)}</small></span><span class="pl-s ok">${ICON.check}</span></a>`;
      const st = slotStatus(q.slots[0], now), open = q.slots.some(x => slotStatus(x, now) === "open");
      const label = open ? "À réserver" : st === "notyet" ? openShort(q.slots[0]) : "—";
      return `<a class="pl-row ${open ? "todo" : "wait"}" href="#/${y}/k/${q.n}"><span class="pl-k">K${q.n}</span><span class="pl-b"><b>${dates}</b><br><small>Pas encore ${acc("inscrit", me.gender)}</small></span><span class="pl-s ${open ? "todo" : "wait"}">${esc(label)}</span></a>`;
    }).join("");
    const nIn = qs.filter(q => mine.some(x => Number(x.q) === q.n)).length;
    return `<div class="pl-subj"><div class="pl-h"><span>${esc(m.emoji || "")} ${esc(Y.subjectLabel)}</span><small>${nIn}/${qs.length} ${qs.length > 1 ? "inscriptions" : "inscription"}</small></div>${rows || `<div class="pl-row wait"><span class="pl-b"><small>Plus de khôlle à venir.</small></span></div>`}</div>`;
  }).join("");
}
function fullPlanHTML(me, years, restHTML, now){

// Envoi d'une réservation étudiante ; le serveur renvoie le planning à jour
async function submit(btn, busyLabel, payload, okMsg, onSuccess){
  const me = AUTH.student, label = btn.textContent;
  btn.disabled = true; btn.textContent = busyLabel;
  payload.token = me && me.token;
  let r;
  try { r = await API.post(payload); }
  catch(e){
    btn.textContent = "Vérification…";
    let done = false;
    try {
      await loadBookings(payload.year, true);
      const has = ((state.bookings[payload.year] || {})[payload.slotId] || []).some(b => b.student === me.name);
      done = (payload.action === "absent") ? !has : has;
    } catch(e2){}
    r = done ? { ok: true } : { ok: false, error: "Connexion impossible (" + e.message + "). Réessayez." };
  }
  if (r.auth){ closeSheet(); return studentLogout(r.error); }
  if (Array.isArray(r.bookings)) applyState(payload.year, r);
  if (r.ok){ if (onSuccess) onSuccess(); else { closeSheet(); toast(okMsg); } }
  else { $("#msg").innerHTML = errBox(esc(r.error || "Opération refusée.")); btn.disabled = false; btn.textContent = label; }
  draw();
}

function openTeacherSlot(s){
  const t = takers(s), st = slotStatus(s), cx = cancelOf(s), Y = CONFIG.YEARS[s.year];
  const canChange = st !== "past" && !cx;
  const inKholle = new Set(allBookings(s.year).filter(b => Number(b.q) === s.q).map(b => b.student));
  const candidates = promoStudents(Y.promo).filter(n => !inKholle.has(n) && inRoster(s.year, n));
  openSheet(`
    <h4 id="sheetTitle">Créneau</h4>
    ${slotMeta(s)}
    ${cx ? `<div class="alert err">${ICON.warn}<span>Séance annulée${cx.reason ? " · " + esc(cx.reason) : ""}.</span></div>` : ""}
    <p class="lbl">${t.length ? plural(t.length, "Inscrit", "Inscrits") : "Aucun inscrit"}</p>
    <div class="group" style="box-shadow:none">${t.map(b => `<div class="trow"><span>${esc(b.student)}</span>${canChange ? `<button class="sbtn cancel" data-un="${esc(b.student)}">Désinscrire</button>` : ""}</div>`).join("") || '<div class="trow"><span class="muted">—</span></div>'}</div>
    ${canChange && freeSeats(s) ? `
      <label class="lbl" for="who" style="margin-top:14px">Inscrire un étudiant</label>
      ${nameSelect(candidates, "Choisir un étudiant…")}
      <p class="hint">Inscription immédiate, même avant l'ouverture des réservations. L'opération est notée au journal.</p>` : ""}
    <div class="msg" id="msg"></div>
    ${st === "past" && t.length && !cx ? `<div class="actions"><a class="btn primary" href="#/prof/notes/${encodeURIComponent(s.sid)}">${ICON.pen} ${canGrade(TCTX(), s.examiner) ? "Saisir les notes" : "Voir les notes"}</a></div>` : ""}
    <div class="actions">
      ${canChange && freeSeats(s) ? `<button class="btn primary" id="add" disabled>Inscrire</button>` : ""}
      <button class="btn ghost" id="close">Fermer</button>
    </div>`);
  $("#close").onclick = closeSheet;
  const go = async (btn, payload, ok) => {
    btn.disabled = true; const l = btn.textContent; btn.textContent = "…";
    let r; try { r = await tCall(payload); } catch(e){ r = { ok: false, error: "Connexion impossible." }; }
    if (r.auth){ closeSheet(); return teacherExpired(); }
    if (Array.isArray(r.bookings)) applyState(s.year, r);
    if (!r.ok){ $("#msg").innerHTML = errBox(esc(r.error || "Refusé.")); btn.disabled = false; btn.textContent = l; return; }
    closeSheet(); toast(ok); state.journal = null; renderProf();
  };
  const sel = $("#who"), add = $("#add");
  if (sel){ sel.onchange = () => { add.disabled = !sel.value; }; add.onclick = () => go(add, { action: "teacherBook", year: s.year, q: s.q, slotId: s.id, student: sel.value }, sel.value + " " + acc("inscrit", genderOf(sel.value, Y.promo)) + "."); }
  $$("[data-un]").forEach(b => b.onclick = () => go(b, { action: "teacherUnbook", year: s.year, q: s.q, slotId: s.id, student: b.dataset.un }, b.dataset.un + " désinscrit(e)."));
}

const WD = ["", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
function sessionText(s){
  const d0 = sesDurC(s), stp = sesStepC(s), ref = s.date || iso(new Date());
  const mins = Array.from({ length: Number(s.count) }, (_, i) => toMin(s.start) + i * stp).filter(m => !isOffC(s, m, ref));
  const hours = mins.length ? fmtTime(mins[0]) + " – " + fmtTime(mins[mins.length - 1] + d0) : "—";
  const n = mins.length, holes = n < Number(s.count) ? `<br><small>Horaires : ${mins.map(fmtTime).join(", ")}</small>` : "";
  return (s.date
    ? `<b>${esc(fmtDay(parseISO(s.date)))} · ${hours}</b><br><span>${plural(n, "# créneau", "# créneaux")} · ${plural(Number(s.cap) || 1, "# place", "# places")} · salle ${esc(s.room)} · Khôlle ${s.q}</span>`
    : `<b>${cap(WD[s.weekday])} · ${hours}</b><br><span>${plural(n, "# créneau", "# créneaux")} · ${plural(Number(s.cap) || 1, "# place", "# places")} · salle ${esc(s.room)}${s.week ? " · semaine " + s.week : ""}</span>${s.from || s.until ? `<br><small>${s.from ? "à partir du " + esc(fmtDate(parseISO(s.from))) : ""}${s.from && s.until ? " · " : ""}${s.until ? "jusqu'au " + esc(fmtDate(parseISO(s.until))) : ""}</small>` : ""}`) + holes;
}
async function renderSeances(force){

  const Y = CONFIG.YEARS[year], today = iso(new Date());
  const visible = Y.sessions.filter(s => !(s.until && s.until < today) && !(s.date && s.date < today));
  const mineFirst = visible.filter(s => s.examiner === c.name).concat(visible.filter(s => s.examiner !== c.name));
  const canEdit = (s) => c.isResp || s.examiner === c.name;
  const shown = mineFirst;   // toutes les séances : la salle est modifiable par tous

async function sessionCall(payload, ok){

function openEditSession(c, year, s, roomOnly){

    });

  };
  if (!roomOnly){ $$(".hchip").forEach(ch => ch.onclick = () => { const m = Number(ch.dataset.m); sel.has(m) ? sel.delete(m) : sel.add(m); paint(); }); paint(); }

      const r0 = await sessionCall({ action: "updateSession", year, id: s.id, count: Number(s.count), cap, room }, "Salle modifiée.");

const frD = (d) => { const [y, m, dd] = d.split("-"); return dd + "/" + m + "/" + y; };
function parseDates(line){
  return line.split(/[,;\s]+/).filter(Boolean).map(t => {
    let m = t.match(/^(\d{4})-(\d{2})-(\d{2})$/); if (m) return t;
    m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if (m) return (m[3].length === 2 ? "20" + m[3] : m[3]) + "-" + m[2].padStart(2, "0") + "-" + m[1].padStart(2, "0");
    return "!" + t;
  });
}

async function renderAnnul(force){
  const c = TCTX(), years = subjectYears(c.subject), year = state.tYear;
  setAccent(year || "1"); if (c.admin) document.body.classList.add("admin-mode");
  setTeacherBar(c, "Annuler une séance");
  const view = $("#view");
  if (!year){ view.innerHTML = adminStrip(c) + '<div class="empty">Aucun planning.</div>'; bindAdminStrip(); return; }
  if (force || !state.bookings[year]) view.innerHTML = '<div class="loading"><span class="spin"></span>Chargement…</div>';
  try { await loadBookings(year, force); } catch(e){ view.innerHTML = errBox("Impossible de joindre le serveur."); return; }
  const Y = CONFIG.YEARS[year], now = new Date();
  const qs = khollesFor(year).filter(q => !khollePast(q, now));
  let html = adminStrip(c) + yearTabs(years, year) + `
    <div class="alert info">${ICON.info}<span>Annuler une séance libère les inscriptions de ses créneaux et affiche un <b>bandeau d'alerte</b> aux étudiants. Ils peuvent alors se réinscrire sur une autre date de la khôlle. Une séance annulée par erreur peut être rétablie.</span></div>`;
  if (!qs.length) html += '<div class="empty">Aucune séance à venir.</div>';
  qs.forEach(q => {
    html += `<p class="kicker" style="margin-top:18px">Khôlle ${q.n} · ${esc(fmtDates(q.days.map(x => x.date)))}</p><div class="group">`;
    q.days.filter(x => !dayFrozen(x.date, now)).forEach(day => {
      const sessions = {};
      day.slots.forEach(sl => { (sessions[sl.sid] ||= []).push(sl); });
      Object.values(sessions).forEach(list => {
        const s0 = list[0], cx = cancelOf(s0);
        const n = list.reduce((a, sl) => a + takers(sl).length, 0), seats = list.reduce((a, sl) => a + sl.cap, 0);
        const hours = list[0].label.split(" – ")[0] + " – " + list[list.length-1].label.split(" – ")[1];
        html += `<div class="srow${cx ? " is-cancelled" : ""}">
          <div class="sinfo">
            <div class="sday">${esc(fmtDay(day.date))}</div>
            <div class="smeta">${esc(s0.examiner)} · ${esc(s0.room)} · ${hours}</div>
            <div class="smeta">${cx ? `<span class="pill cancel">Annulée</span>${cx.reason ? " " + esc(cx.reason) : ""}` : `${n} inscrit${n>1?"s":""} / ${seats}`}</div>
          </div>
          ${cx ? `<button class="sbtn restore" data-sid="${esc(s0.sid)}">Rétablir</button>` : `<button class="sbtn cancel" data-sid="${esc(s0.sid)}">Annuler</button>`}
        </div>`;
      });
    });
    html += `</div>`;
  });
  view.innerHTML = html;
  bindAdminStrip();
  $$(".tab[data-y]").forEach(t => t.onclick = () => { state.tYear = t.dataset.y; renderAnnul(); });
  const sessionSlots = (sid) => Object.values(SLOT_INDEX).filter(sl => sl.sid === sid).sort((a, b) => a.start - b.start);
  $$(".sbtn[data-sid]").forEach(btn => btn.onclick = () => {
    const list = sessionSlots(btn.dataset.sid), s0 = list[0];
    const payload = { year: s0.year, q: s0.q, sid: s0.sid, date: s0.dateISO, examiner: s0.examiner, room: s0.room };
    const meta = `<p class="meta"><b>Khôlle ${s0.q}</b> · ${esc(Y.short)}<br>${fmtDay(s0.date)} · ${esc(exName(s0.year, s0.examiner))} · salle <b>${esc(s0.room)}</b></p>`;
    if (btn.classList.contains("restore")) return confirmAdmin({
      title: "Rétablir la séance", meta, text: "La séance redevient visible et réservable par les étudiants. Le bandeau d'alerte disparaît.",
      label: "Rétablir la séance", cls: "primary", payload: Object.assign({ action: "restoreSession" }, payload),
      done: () => "Séance rétablie.", after: () => renderAnnul(true)
    });
    const inscrits = list.flatMap(sl => takers(sl).map(b => `<li><b>${esc(b.student)}</b> · ${sl.label}</li>`));
    confirmAdmin({
      title: "Annuler la séance", meta, warn: true, cls: "danger-fill", label: "Annuler la séance",
      text: inscrits.length
        ? `<b>${inscrits.length} inscription${inscrits.length>1?"s":""} ${inscrits.length>1?"seront libérées":"sera libérée"}</b> :<ul class="clist">${inscrits.join("")}</ul>Ces étudiants pourront se réinscrire sur une autre date de la khôlle.`
        : "Aucun étudiant n'est inscrit sur cette séance.",
      extra: `<label class="lbl" for="reason">Motif affiché aux étudiants <span style="font-weight:500;color:var(--muted)">(facultatif)</span></label>
        <input class="field" id="reason" maxlength="120" placeholder="Ex. : examinateur absent, sortie pédagogique…">`,
      confirmLabel: "Je confirme l'annulation de cette séance.",
      collect: () => ({ reason: ($("#reason") || {}).value || "" }),
      payload: Object.assign({ action: "cancelSession" }, payload),
      done: (r) => (r.released && r.released.length) ? `Séance annulée · ${r.released.length} inscription${r.released.length>1?"s":""} libérée${r.released.length>1?"s":""}.` : "Séance annulée.",
      after: () => { state.journal = null; renderAnnul(true); }
    });
  });
}

function confirmAdmin(o){
  openSheet(`
    <h4 id="sheetTitle">${o.title}</h4>
    ${o.meta || ""}
    <div class="alert ${o.warn ? "err" : "info"}" style="margin-top:14px">${o.warn ? ICON.warn : ICON.info}<span>${o.text}</span></div>
    ${o.extra || ""}
    ${o.warn ? `<label class="check"><input type="checkbox" id="sure"> <span>${o.confirmLabel || "Je confirme la suppression définitive."}</span></label>` : ""}
    <div class="msg" id="msg"></div>
    <div class="actions">
      <button class="btn ${o.cls}" id="go" ${o.warn ? "disabled" : ""}>${o.label}</button>
      <button class="btn ghost" id="close">Annuler</button>
    </div>`);
  $("#close").onclick = closeSheet;
  const go = $("#go"), sure = $("#sure");
  if (sure) sure.onchange = () => { go.disabled = !sure.checked; };
  go.onclick = async () => {
    go.disabled = true; const label = go.textContent; go.textContent = "Traitement…";
    let r;
    const extra = o.collect ? o.collect() : {};
    try { r = await (o.call || tCall)(Object.assign({}, o.payload, extra)); } catch(e){ r = { ok: false, error: "Connexion impossible." }; }
    if (r.auth){ closeSheet(); return o.call ? adminExpired() : teacherExpired(); }
    if (!r.ok){ $("#msg").innerHTML = errBox(esc(r.error || "Opération refusée.")); go.disabled = false; go.textContent = label; return; }
    closeSheet(); toast(o.done(r)); if (state.sel) state.sel.clear(); (o.after || (() => renderJournal(true)))(r);
  };
}

/* ---------- Journal ---------- */
async function renderJournal(force){
  const general = parts()[0] === "gestion";
  const c = general ? (AUTH.admin ? { admin: true, token: AUTH.admin.token, subject: null } : null) : TCTX();
  if (!c) return general ? adminLoginForm() : teacherLoginForm();
  setAccent("1"); if (c.admin) document.body.classList.add("admin-mode");
  if (general) setBar({ title: "Journal général", sub: "Gestion · toutes les matières", back: true, refresh: true });
  else setTeacherBar(c, "Journal");
  const view = $("#view");
  const key = (general ? "*" : c.subject);
  if (force || !state.journal || state.jKey !== key){
    view.innerHTML = '<div class="loading"><span class="spin"></span>Chargement…</div>';
    let r;
    try { r = await API.get({ action: "journal", token: c.token, subject: c.subject }); } catch(e){ r = { ok: false, error: "Connexion impossible." }; }
    if (!r.ok){ if (r.auth) return general ? adminExpired() : teacherExpired(); view.innerHTML = errBox(esc(r.error || "Accès refusé.")); return; }
    state.journal = r.log.slice().reverse(); state.archive = (r.archive || []).slice().reverse(); state.jKey = key;
  }
  const yearsList = general ? Object.keys(CONFIG.YEARS) : subjectYears(c.subject);
  const isArch = state.jTab === "archive";
  const source = isArch ? state.archive : state.journal;
  if (state.jYear && !yearsList.includes(state.jYear)) state.jYear = "";
  const rows = source.filter(e =>
    (!state.jYear || String(e.year) === state.jYear) &&
    (!state.jSearch || (e.student + " " + (e.from || "") + " " + (e.actor || "")).toLowerCase().includes(state.jSearch.toLowerCase())));
  const badge = (a) => `<span class="badge ${/^Inscription|rétablie|ajouté|ouverte/.test(a) ? "b-book" : /Remplacement|Déplacement|modifi|Calendrier|Nouveau code|réinitialisé/.test(a) ? "b-replace" : /annul|retir|Libéré|fermée/i.test(a) ? "b-annul" : "b-cancel"}">${esc(a)}</span>`;
  const when = (t) => { const d = new Date(t); return isNaN(d) ? esc(t) : d.toLocaleDateString("fr-FR", { day:"2-digit", month:"2-digit" }) + " " + d.toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" }); };
  const yLabel = (y) => CONFIG.YEARS[y] ? (general ? CONFIG.YEARS[y].subjectLabel + " " : "") + CONFIG.YEARS[y].short : (CONFIG.PROMOS[y] ? CONFIG.PROMOS[y].short : y);
  const sel = state.sel || (state.sel = new Set());
  [...sel].forEach(k => { if (!source.some(e => e.key === k)) sel.delete(k); });
  view.innerHTML = `
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="${!isArch}" class="tab${!isArch ? " on" : ""}" data-tab="journal">Journal (${state.journal.length})</button>
      <button role="tab" aria-selected="${isArch}" class="tab${isArch ? " on" : ""}" data-tab="archive">Archives (${state.archive.length})</button>
    </div>
    <div class="filters">
      <select id="jYear" aria-label="Planning"><option value="">Tous</option>${yearsList.map(y => `<option value="${y}" ${state.jYear===y?"selected":""}>${esc(yLabel(y))}</option>`).join("")}</select>
      <input class="field" id="jSearch" type="search" placeholder="Nom…" aria-label="Rechercher un nom" value="${esc(state.jSearch)}">
    </div>
    ${rows.length ? `
    <label class="selall"><input type="checkbox" id="selAll"> <span>Tout sélectionner <span class="muted">(${plural(rows.length, "# opération affichée", "# opérations affichées")})</span></span></label>
    <div class="group">${rows.map(e => `
      <label class="entry pick${sel.has(e.key) ? " picked" : ""}">
        <input type="checkbox" class="pickbox" value="${esc(e.key)}" ${sel.has(e.key) ? "checked" : ""} aria-label="Sélectionner">
        <span class="ebody">
          <span class="top">${badge(e.action)}<span class="when">${when(e.at)}</span></span>
          <span class="who">${e.action === "Déplacement" && e.from ? `${esc(e.student)} <span style="font-weight:600;color:var(--muted)">quitte ${esc(e.from)}</span>` : e.action === "Remplacement" ? `${esc(e.student)} <span style="font-weight:600;color:var(--muted)">remplace</span> ${esc(e.from)}` : /^Séance/.test(e.action) ? `${esc(e.student)} <span style="font-weight:600;color:var(--muted)">· ${esc(e.time || "séance")}</span>` : esc(e.student)}</span>
          <span class="what">${esc(yLabel(e.year))}${e.q ? " · Khôlle " + esc(e.q) : ""}${e.date ? " · " + esc(fmtDay(parseISO(String(e.date)))) : ""}${/^Séance|Calendrier|Code|code|Étudiant|Enseignant|Matière|Vacances|Mise/.test(e.action) || !e.time ? "" : " · " + esc(e.time)}${e.room ? " · " + esc(e.room) : ""}</span>
          <span class="dev">${e.action === "Séance annulée" && e.from ? "Motif : " + esc(e.from) + " · " : ""}${e.actor ? "Par " + esc(e.actor) + " · " : ""}Appareil ${esc(e.device || "—")}${e.archivedAt ? " · archivé le " + when(e.archivedAt) : ""}</span>
        </span>
      </label>`).join("")}</div>` : `<div class="empty">${isArch ? "Aucune opération archivée." : "Aucune opération."}</div>`}
    <div class="selbar" id="selbar">
      ${isArch
        ? `<button class="btn danger-fill" id="delSel" disabled></button>
           ${state.archive.length ? `<button class="btn outline danger" id="purgeAll">Vider toutes les archives (${state.archive.length})</button>` : ""}`
        : `<button class="btn primary" id="archSel" disabled></button>`}
    </div>`;
  const visibleKeys = rows.map(e => e.key);
  const chosen = () => visibleKeys.filter(k => sel.has(k));
  const refreshSel = () => {
    const n = chosen().length, all = $("#selAll");
    if (all){ all.checked = n > 0 && n === visibleKeys.length; all.indeterminate = n > 0 && n < visibleKeys.length; }
    $$(".pickbox").forEach(b => b.closest(".entry").classList.toggle("picked", b.checked));
    const a = $("#archSel"), d = $("#delSel");
    if (a){ a.disabled = !n; a.textContent = n ? "Archiver la sélection (" + n + ")" : "Sélectionnez les opérations à archiver"; }
    if (d){ d.disabled = !n; d.textContent = n ? "Supprimer la sélection (" + n + ")" : "Sélectionnez les opérations à supprimer"; }
  };
  $$(".pickbox").forEach(b => b.onchange = () => { b.checked ? sel.add(b.value) : sel.delete(b.value); refreshSel(); });
  const all = $("#selAll");
  if (all) all.onchange = () => { visibleKeys.forEach(k => all.checked ? sel.add(k) : sel.delete(k)); $$(".pickbox").forEach(b => b.checked = all.checked); refreshSel(); };
  refreshSel();
  $$(".tab[data-tab]").forEach(t => t.onclick = () => { state.jTab = t.dataset.tab; sel.clear(); renderJournal(); });
  const call = (p) => API.post(Object.assign({ token: c.token, subject: c.subject || undefined }, p));
  const ab = $("#archSel");
  if (ab) ab.onclick = () => { const keys = chosen(); confirmAdmin({ call,
    title: "Archiver la sélection", text: `${plural(keys.length, "# opération sera déplacée", "# opérations seront déplacées")} vers les archives. Elles restent consultables dans l'onglet « Archives » jusqu'à leur suppression définitive.`,
    label: "Archiver", cls: "primary", payload: { action: "archive", keys }, done: (r) => plural(r.moved, "# opération archivée.", "# opérations archivées.")
  }); };
  const dbtn = $("#delSel");
  if (dbtn) dbtn.onclick = () => { const keys = chosen(); confirmAdmin({ call,
    title: "Supprimer la sélection", text: `<b>Suppression définitive</b> de ${plural(keys.length, "# opération archivée", "# opérations archivées")}. Cette action est irréversible.`,
    label: "Supprimer définitivement", cls: "danger-fill", warn: true, payload: { action: "purgeArchive", keys }, done: (r) => plural(r.removed, "# opération supprimée.", "# opérations supprimées.")
  }); };
  const pa = $("#purgeAll");
  if (pa) pa.onclick = () => confirmAdmin({ call,
    title: "Vider toutes les archives", text: `<b>Suppression définitive</b> de ${plural(state.archive.length, "l'opération archivée", "toutes les opérations archivées (#)")}. Cette action est irréversible.`,
    label: "Vider définitivement", cls: "danger-fill", warn: true, payload: { action: "purgeArchive", all: true }, done: (r) => plural(r.removed, "Archives vidées (# opération supprimée).", "Archives vidées (# opérations supprimées).")
  });
  $("#jYear").onchange = (e) => { state.jYear = e.target.value; renderJournal(); };
  const js = $("#jSearch");
  js.oninput = (e) => { state.jSearch = e.target.value; clearTimeout(js._t); js._t = setTimeout(() => { renderJournal(); const n = $("#jSearch"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };
}

async function loadAdm(force){
  if (state.adm && !force) return state.adm;
  const r = await aCall({ action: "adminData" });
  if (r.auth){ adminExpired(); return null; }
  if (!r.ok) throw new Error(r.error || "Erreur");
  // Première mise en service : envoi de la configuration d'origine
  if (!r.cfg){
    $("#view").innerHTML = '<div class="loading"><span class="spin"></span>Première mise en service : enregistrement des plannings, listes et khôlleurs…</div>';
    const years = {};
    Object.entries(CONFIG.YEARS).forEach(([k, Y]) => years[k] = { firstNumber: Y.firstNumber, kholles: Y.kholles, sessions: Y.sessions, overrides: Y.overrides || {} });
    const students = Object.entries(SEED_STUDENTS).flatMap(([promo, l]) => l.map(([name, gender]) => ({ promo, name, gender })));
    const teachers = [];
    Object.keys(years).forEach(k => years[k].sessions.forEach(s => { const subject = subjectOfYear(k); if (!teachers.some(t => t.name === s.examiner && t.subject === subject)) teachers.push({ name: s.examiner, subject, role: SEED_RESP[subject] === s.examiner ? "resp" : "kholleur" }); }));
    const imp = await aCall({ action: "importConfig", cfg: { years, closed: CONFIG.CLOSED, subjects: CONFIG.SUBJECTS.map(({ key, label, emoji, prefix, open }) => ({ key, label, emoji, prefix, open })) }, students, teachers });
    if (!imp.ok) throw new Error(imp.error || "Mise en service impossible");
    await loadConfig();
    toast("Mise en service effectuée.");
    return loadAdm(true);
  }
  state.adm = r;
  return r;
}
async function renderGestionRoute(sub, force){

  if (!adm || parts()[0] !== "gestion") return;
  if (sub === "etudiants") return renderGStudents();

      ${locked.map(s => `<button class="card gcard warnc" data-unlock="${s.id}"><span class="num">${ICON.warn}</span><span><span class="t">Compte ${acc("bloqué", s.gender)}</span><br><span class="d">${esc(s.name)} · trop d'essais</span></span><span class="sbtn cancel">Débloquer</span></button>`).join("")}

  $$("[data-act]").forEach(b => b.onclick = () => { setAct(b.dataset.act); state.tYear = null; state.tEx = null; state.journal = null; location.hash = "#/prof"; });
  const va = $("#viewAs"); if (va) va.onclick = openViewAs;

  $("#alogout").onclick = () => { AUTH.admin = null; state.adm = null; location.hash = "#/"; toast("Gestion fermée."); };
}
function renderGStudents(){
  gestionBar("Étudiants");
  const adm = state.adm, pr = state.gPromo, f = state.gFilter, q = state.gSearch.toLowerCase();
  const all = adm.students.filter(s => s.promo === pr);
  const list = all.filter(s => (f === "all" || (f === "nocode" && !s.hasCode) || (f === "locked" && s.locked) || (f === "nogender" && !s.gender)) && (!q || s.name.toLowerCase().includes(q)));
  const status = (s) => s.locked ? `<span class="st err">${acc("Bloqué", s.gender)}</span>` : s.hasCode ? `<span class="st ok">Code créé</span>${s.lastSeen ? `<span class="muted"> · vu le ${new Date(s.lastSeen).toLocaleDateString("fr-FR", { day: "numeric", month: "short" })}</span>` : ""}` : `<span class="st warn">Pas encore ${acc("connecté", s.gender)}</span>`;
  $("#view").innerHTML = `
    <div class="tabs">${Object.keys(CONFIG.PROMOS).map(p => `<button class="tab${p === pr ? " on" : ""}" data-p="${p}">${esc(CONFIG.PROMOS[p].label)} · ${adm.students.filter(s => s.promo === p).length}</button>`).join("")}</div>
    <div class="filters"><input class="field" id="gq" type="search" placeholder="Rechercher un nom" value="${esc(state.gSearch)}"><button class="btn primary" id="addSt" style="min-height:46px">${ICON.plus} Ajouter</button></div>
    <div class="chips">${[["all", "Tous"], ["nocode", "Sans code · " + all.filter(s => !s.hasCode).length], ["locked", "Bloqués · " + all.filter(s => s.locked).length], ["nogender", "Genre à préciser · " + all.filter(s => !s.gender).length]].map(([k, l]) => `<button class="chip${f === k ? " on" : ""}" data-f="${k}">${l}</button>`).join("")}</div>
    <div class="group">${list.map(s => `
      <div class="grow">
        <div class="gname"><b>${esc(s.name)}</b><br>${status(s)}</div>
        <div class="gseg" role="group" aria-label="Genre"><button class="${s.gender === "F" ? "on" : ""}" data-g="F" data-id="${s.id}" title="Fille">F</button><button class="${s.gender === "G" ? "on" : ""}" data-g="G" data-id="${s.id}" title="Garçon">G</button></div>
        <button class="sbtn" data-menu="${s.id}" aria-label="Actions">•••</button>
      </div>`).join("") || '<div class="grow"><span class="muted">Aucun étudiant.</span></div>'}</div>
    <p class="hint">F / G sert aux accords (inscrit / inscrite). Les codes sont choisis par les étudiants et enregistrés chiffrés : personne ne peut les lire. « Réinitialiser » permet à l'étudiant d'en choisir un nouveau.</p>`;
  $$(".tab[data-p]").forEach(t => t.onclick = () => { state.gPromo = t.dataset.p; renderGStudents(); });
  $$(".chip[data-f]").forEach(t => t.onclick = () => { state.gFilter = t.dataset.f; renderGStudents(); });
  const gq = $("#gq"); gq.oninput = () => { state.gSearch = gq.value; clearTimeout(gq._t); gq._t = setTimeout(() => { renderGStudents(); const n = $("#gq"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };
  $$("[data-g]").forEach(b => b.onclick = async () => {
    const s = adm.students.find(x => x.id === Number(b.dataset.id)), g = s.gender === b.dataset.g ? "" : b.dataset.g;
    const r = await aCall({ action: "updateStudent", id: s.id, gender: g });
    if (r.auth) return adminExpired();
    if (r.ok){ s.gender = g; renderGStudents(); loadConfig().catch(() => {}); }
  });
  $$("[data-menu]").forEach(b => b.onclick = () => studentMenu(adm.students.find(x => x.id === Number(b.dataset.menu))));
  $("#addSt").onclick = () => {
    openSheet(`<h4 id="sheetTitle">Ajouter un étudiant</h4><p class="meta">${esc(CONFIG.PROMOS[pr].label)}</p>
      <label class="lbl" for="nName">Nom et prénom</label><input class="field" id="nName" placeholder="NOM Prénom">
      <label class="lbl" style="margin-top:12px">Genre</label><div class="tabs"><button class="tab" data-ng="F">Fille</button><button class="tab" data-ng="G">Garçon</button></div>
      <div class="msg" id="msg"></div><div class="actions"><button class="btn primary" id="go">Ajouter</button><button class="btn ghost" id="close">Annuler</button></div>`);
    let g = ""; $$("[data-ng]").forEach(t => t.onclick = () => { g = t.dataset.ng; $$("[data-ng]").forEach(x => x.classList.toggle("on", x === t)); });
    $("#close").onclick = closeSheet;
    $("#go").onclick = async () => { const r = await aCall({ action: "addStudent", promo: pr, name: $("#nName").value, gender: g }); if (!r.ok) return $("#msg").innerHTML = errBox(esc(r.error)); closeSheet(); toast("Étudiant ajouté."); loadConfig().catch(() => {}); renderGestionRoute("etudiants", true); };
  };
}
function studentMenu(s){
  openSheet(`<h4 id="sheetTitle">${esc(s.name)}</h4><p class="meta">${esc(CONFIG.PROMOS[s.promo].label)} · ${s.hasCode ? "code créé" : "pas encore de code"}${s.locked ? ` · <b>${acc("bloqué", s.gender)}</b>` : ""}</p>
    <div class="msg" id="msg"></div>
    <div class="actions">
      ${s.locked ? `<button class="btn primary" id="unl">Débloquer le compte</button>` : ""}
      ${s.hasCode ? `<button class="btn outline" id="rst">Réinitialiser le code</button><p class="hint" style="margin:-4px 0 0">Son code actuel ne fonctionnera plus. À sa prochaine connexion, ${s.gender === "F" ? "elle" : s.gender === "G" ? "il" : "l'étudiant(e)"} choisira un nouveau code. Ses inscriptions sont conservées.</p>` : ""}
      <button class="btn outline danger" id="del">Retirer de la liste</button>
      <button class="btn ghost" id="close">Fermer</button>
    </div>`);
  $("#close").onclick = closeSheet;
  const run = async (p, ok) => { const r = await aCall(p); if (r.auth) return adminExpired(); if (!r.ok) return $("#msg").innerHTML = errBox(esc(r.error)); closeSheet(); toast(ok); loadConfig().catch(() => {}); renderGestionRoute("etudiants", true); };
  const u = $("#unl"); if (u) u.onclick = () => run({ action: "updateStudent", id: s.id, gender: s.gender, unlock: true }, "Compte débloqué.");
  const r = $("#rst"); if (r) r.onclick = () => run({ action: "resetStudent", id: s.id }, "Code réinitialisé.");
  $("#del").onclick = () => { if ($("#del").dataset.sure) run({ action: "removeStudent", id: s.id }, "Étudiant retiré."); else { $("#del").dataset.sure = 1; $("#del").textContent = "Confirmer le retrait"; } };
}
function showCodeOnce(name, code){
  openSheet(`<h4 id="sheetTitle">Code de ${esc(name)}</h4>
    <div class="codebox">${esc(code)}</div>
    <div class="alert err">${ICON.warn}<span><b>Ce code ne sera plus jamais affiché.</b> Notez-le ou transmettez-le maintenant. L'enseignant pourra le changer depuis son espace.</span></div>
    <div class="actions"><button class="btn outline" id="cp">Copier</button><button class="btn primary" id="close">C'est noté</button></div>`);
  $("#cp").onclick = () => { navigator.clipboard && navigator.clipboard.writeText(code).then(() => toast("Code copié.")); };
  $("#close").onclick = () => { closeSheet(); renderGestionRoute("enseignants", true); };
}
function renderGTeachers(){
  gestionBar("Enseignants");
  const adm = state.adm;
  const groups = CONFIG.SUBJECTS.filter(s => s.open || adm.teachers.some(t => t.subject === s.key));
  $("#view").innerHTML = `
    <div class="actions" style="margin-top:0"><button class="btn primary" id="addT">${ICON.plus} Ajouter un enseignant</button></div>
    ${groups.map(s => `
      <p class="kicker" style="margin-top:18px">${esc(s.emoji)} ${esc(s.label)}</p>
      <div class="group">${adm.teachers.filter(t => t.subject === s.key).map(t => `
        <div class="grow">
          <div class="gname"><b>${esc(t.name)}</b><br><span class="${t.hasCode ? "st ok" : "st warn"}">${t.hasCode ? "Code attribué" : "Pas de code"}</span>${t.lastSeen ? `<span class="muted"> · vu le ${new Date(t.lastSeen).toLocaleDateString("fr-FR", { day: "numeric", month: "short" })}</span>` : ""}</div>
          <div class="selectwrap mini"><select data-role="${t.id}"><option value="kholleur" ${t.role !== "resp" ? "selected" : ""}>${/^Mme/.test(t.name) ? "Khôlleuse" : "Khôlleur"}</option><option value="resp" ${t.role === "resp" ? "selected" : ""}>Responsable</option></select>${ICON.down}</div>
          <button class="sbtn" data-tmenu="${t.id}" aria-label="Actions">•••</button>
        </div>`).join("") || '<div class="grow"><span class="muted">Aucun enseignant.</span></div>'}</div>`).join("")}
    <p class="hint">Le responsable gère le calendrier des khôlles et toutes les séances de la matière ; chaque khôlleur gère ses propres séances. Tous peuvent annuler une séance de la matière et inscrire un étudiant.</p>`;
  $$("[data-role]").forEach(sel => sel.onchange = async () => { const r = await aCall({ action: "updateTeacher", id: Number(sel.dataset.role), role: sel.value }); if (r.auth) return adminExpired(); toast(r.ok ? "Rôle mis à jour." : r.error); state.adm = null; });
  $$("[data-tmenu]").forEach(b => b.onclick = () => {
    const t = adm.teachers.find(x => x.id === Number(b.dataset.tmenu));
    openSheet(`<h4 id="sheetTitle">${esc(t.name)}</h4><p class="meta">${esc(subjectMeta(t.subject).label)} · ${t.role === "resp" ? "responsable" : "khôlleur"}</p><div class="msg" id="msg"></div>
      <div class="actions"><button class="btn primary" id="nc">${t.hasCode ? "Attribuer un nouveau code" : "Attribuer un code"}</button><button class="btn outline danger" id="del">Retirer</button><button class="btn ghost" id="close">Fermer</button></div>`);
    $("#close").onclick = closeSheet;
    $("#nc").onclick = async () => { const r = await aCall({ action: "newTeacherCode", id: t.id }); if (r.auth) return adminExpired(); if (!r.ok) return $("#msg").innerHTML = errBox(esc(r.error)); state.adm = null; showCodeOnce(t.name, r.code); };
    $("#del").onclick = async () => { if (!$("#del").dataset.sure){ $("#del").dataset.sure = 1; $("#del").textContent = "Confirmer le retrait"; return; } const r = await aCall({ action: "removeTeacher", id: t.id }); if (!r.ok) return $("#msg").innerHTML = errBox(esc(r.error)); closeSheet(); toast("Enseignant retiré."); renderGestionRoute("enseignants", true); };
  });
  $("#addT").onclick = () => {
    openSheet(`<h4 id="sheetTitle">Ajouter un enseignant</h4>
      <label class="lbl" for="tName">Nom affiché</label><input class="field" id="tName" placeholder="Mme Dupont">
      <p class="hint">Écrivez-le exactement comme dans les plannings (M. / Mme + nom).</p>
      <label class="lbl" for="tSub" style="margin-top:12px">Matière</label><div class="selectwrap"><select id="tSub">${CONFIG.SUBJECTS.map(s => `<option value="${s.key}">${esc(s.label)}</option>`).join("")}</select>${ICON.down}</div>
      <label class="lbl" for="tRole" style="margin-top:12px">Rôle</label><div class="selectwrap"><select id="tRole"><option value="kholleur">Khôlleur / khôlleuse</option><option value="resp">Responsable de la matière</option></select>${ICON.down}</div>
      <div class="msg" id="msg"></div><div class="actions"><button class="btn primary" id="go">Ajouter et créer son code</button><button class="btn ghost" id="close">Annuler</button></div>`);
    $("#close").onclick = closeSheet;
    $("#go").onclick = async () => { const name = $("#tName").value.trim(); const r = await aCall({ action: "addTeacher", name, subject: $("#tSub").value, role: $("#tRole").value }); if (r.auth) return adminExpired(); if (!r.ok) return $("#msg").innerHTML = errBox(esc(r.error)); state.adm = null; loadConfig().catch(() => {}); showCodeOnce(name, r.code); };
  };
}
function renderGSubjects(){
  gestionBar("Matières");
  $("#view").innerHTML = `
    <div class="group">${CONFIG.SUBJECTS.slice().sort((a, b) => a.label.localeCompare(b.label, "fr")).map(s => `
      <div class="grow">
        <div class="gname"><b>${esc(s.emoji)} ${esc(s.label)}</b><br><span class="${s.open ? "st ok" : "muted"}">${s.open ? "Ouverte aux étudiants" : "Fermée · « Bientôt disponible »"}</span></div>
        ${s.open ? `<button class="sbtn" data-cal="${esc(s.key)}">Calendrier</button>` : ""}
        <button class="sbtn ${s.open ? "cancel" : "restore"}" data-open="${esc(s.key)}" data-v="${s.open ? 0 : 1}">${s.open ? "Fermer" : "Ouvrir"}</button>
      </div>`).join("")}</div>
    <div class="msg" id="msg"></div>
    <p class="hint">Après l'ouverture d'une matière : ajoutez ses enseignants (rubrique Enseignants), saisissez le calendrier des khôlles, puis chaque khôlleur ajoute ses séances.</p>`;
  $$("[data-open]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    const r = await aCall({ action: "setSubject", key: b.dataset.open, open: b.dataset.v === "1" });
    if (r.auth) return adminExpired();
    if (!r.ok){ $("#msg").innerHTML = errBox(esc(r.error)); b.disabled = false; return; }
    applyServerConfig({ cfg: r.cfg }); loadConfig().catch(() => {}); toast(b.dataset.v === "1" ? "Matière ouverte." : "Matière fermée."); renderGSubjects();
  });
  $$("[data-cal]").forEach(b => b.onclick = () => { setAct(b.dataset.cal); state.tYear = null; location.hash = "#/prof/calendrier"; });
}
function renderGVacances(){
  gestionBar("Vacances et jours fériés", "Gestion · zone A");
  const rows = CONFIG.CLOSED.map(r => r.slice());
  const paint = () => {
    $("#view").innerHTML = `
      <div class="group">${rows.map((r, i) => `
        <div class="vrow">
          <input class="field" data-i="${i}" data-k="2" value="${esc(r[2])}" placeholder="Libellé" aria-label="Libellé">
          <div class="two"><input class="field" type="date" data-i="${i}" data-k="0" value="${r[0]}" aria-label="Début"><input class="field" type="date" data-i="${i}" data-k="1" value="${r[1]}" aria-label="Fin"></div>
          <button class="sbtn cancel" data-rm="${i}">Retirer</button>
        </div>`).join("")}</div>
      <div class="actions"><button class="btn outline" id="addV">${ICON.plus} Ajouter une période (pont, fermeture…)</button><button class="btn primary" id="saveV">Enregistrer</button></div>
      <div class="msg" id="msg"></div>
      <div class="alert warn" style="margin-top:14px">${ICON.warn}<span>Toute modification recalcule les séances à venir. Si des étudiants sont inscrits sur une date qui devient fermée, l'enregistrement est refusé et la liste s'affiche.</span></div>`;
    $$("[data-i]").forEach(inp => inp.oninput = () => { rows[Number(inp.dataset.i)][Number(inp.dataset.k)] = inp.value; });
    $$("[data-rm]").forEach(b => b.onclick = () => { rows.splice(Number(b.dataset.rm), 1); paint(); });
    $("#addV").onclick = () => { const d = iso(new Date()); rows.push([d, d, "Fermeture"]); paint(); };
    $("#saveV").onclick = async () => {
      const b = $("#saveV"); b.disabled = true; b.textContent = "Enregistrement…";
      const r = await aCall({ action: "saveClosed", closed: rows });
      b.disabled = false; b.textContent = "Enregistrer";
      if (r.auth) return adminExpired();
      if (!r.ok) return $("#msg").innerHTML = errBox(esc(r.error));
      applyServerConfig({ cfg: r.cfg }); loadConfig().catch(() => {}); toast("Vacances enregistrées."); location.hash = "#/gestion";
    };
  };
  paint();
}

let toastT;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 3400);
}

/* ---------- Contrôle automatique de version ---------- */
function checkVersion(){
  if (location.protocol === "file:") return;
  let last = 0; try { last = Number(sessionStorage.getItem("khollapp-vcheck") || 0); } catch(e){}
  if (Date.now() - last < 5 * 60000) return;
  try { sessionStorage.setItem("khollapp-vcheck", String(Date.now())); } catch(e){}
  fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" })
    .then(r => r.ok ? r.text() : "")
    .then(html => { const m = html.match(/const APP_VERSION = "([^"]+)"/); if (m && m[1].localeCompare(APP_VERSION, undefined, { numeric: true }) > 0) showUpdate(m[1]); })
    .catch(() => {});
}
function showUpdate(v){
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  const how = standalone
    ? (isIOS ? "Si l'ancienne version réapparaît : balayez vers le haut depuis le bas de l'écran, faites glisser Kholl'app vers le haut pour la fermer, puis rouvrez-la depuis son icône."
             : "Si l'ancienne version réapparaît : ouvrez les applis récentes, faites glisser Kholl'app pour la fermer, puis rouvrez-la depuis son icône.")
    : "Si l'ancienne version réapparaît : fermez cet onglet, puis rouvrez le lien de Kholl'app.";
  const bar = $("#updateBar");
  bar.innerHTML = `
    <div class="upd">
      <div class="upd-ico">${ICON.refreshArrow}</div>
      <div class="upd-body"><b>Nouvelle version de Kholl'app disponible</b><span>Touchez « Mettre à jour » pour l'installer (quelques secondes).</span><details><summary>Ça ne marche pas ?</summary><span>${how}</span></details></div>
      <div class="upd-actions"><button class="btn primary" id="doUpdate">Mettre à jour</button><button class="upd-close" id="later" aria-label="Plus tard">×</button></div>
    </div>`;
  bar.hidden = false;
  $("#doUpdate").onclick = () => { $("#doUpdate").textContent = "Mise à jour…"; location.replace(location.pathname + "?v=" + encodeURIComponent(v) + location.hash); };
  $("#later").onclick = () => { bar.hidden = true; };
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkVersion(); });
window.addEventListener("pageshow", checkVersion);
setInterval(checkVersion, 30 * 60000);

route();

</script>
